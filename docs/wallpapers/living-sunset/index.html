<script>
'use strict';
const FRAG=`#version 300 es
precision highp float;
uniform vec2 uR;uniform float uT,uS,uSeed,uWind;uniform int uScene;uniform vec4 uP;uniform vec3 uTint,uSky;
out vec4 o;
float hz,K,SV,A;vec2 sun;vec3 sunC,HZ;
float ss(float a,float b,float x){float t=clamp((x-a)/(b-a),0.,1.);return t*t*(3.-2.*t);}
float gs(float x){return exp(-x*x);}
float h1(float n){n=fract((n+uSeed)*.1031);n*=n+33.33;n*=n+n;return fract(n);}
float h2(vec2 p){vec3 q=fract(vec3(p.xyx+uSeed)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float n1(float x){float i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(h1(i),h1(i+1.),f);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+1.),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*n2(p);p=p*2.03+vec2(17.3,9.1);a*=.5;}return s;}
float f1(float x,int oc){float a=.5,s=0.;for(int i=0;i<6;i++){if(i>=oc)break;s+=a*n1(x);x=x*2.07+31.7;a*=.5;}return s;}
float ridge(float x){float a=.5,s=0.;for(int i=0;i<6;i++){float n=1.-abs(2.*n1(x)-1.);s+=a*n*n;x=x*2.1+13.3;a*=.5;}return s;}

// sky gradient: zenith blue -> pale mid band -> amber horizon, plus restrained solar glow
vec3 skyCol(vec2 p){
 float h=max(p.y-hz,0.);
 vec3 zen=mix(vec3(.12,.28,.58),vec3(.035,.07,.19),K)*uSky;
 vec3 mid=mix(vec3(.43,.58,.79),vec3(.54,.34,.46),K)*uSky;
 vec3 hor=mix(vec3(1.,.78,.50),vec3(1.,.44,.19),K)*uTint*mix(1.,.5,ss(.82,1.,uS));
 vec3 c=mix(hor,mid,ss(0.,.22+.1*uP.y,h));
 c=mix(c,zen,ss(.1,.8,h));
 vec2 d=p-sun;float dim=1.-.5*ss(.85,1.,uS);
 c+=hor*exp(-length(d*vec2(.75,1.))*5.4)*.27*dim;
 c+=hor*exp(-h*11.)*exp(-abs(d.x)*1.8)*.17*dim;
 return c;}

vec3 meadow(vec2 p,vec3 c){
 vec3 warm=mix(vec3(1.,.9,.7),vec3(1.,.62,.42),K);
 for(int i=0;i<5;i++){float fi=float(i),k=fi/4.;
  float y=hz+.035-k*k*.2+(f1(p.x*(2.4-k*1.3)+fi*19.,4)-.5)*(.04+.1*k);
  if(i<3)y+=pow(n1(p.x*(70.-fi*18.)+fi*7.),2.)*.01*(1.+fi*.7);
  float dp=y-p.y;if(dp<-.002)continue;
  vec3 g=mix(vec3(.3,.36,.17),vec3(.09,.13,.045),k)*warm*A;
  g*=.7+.6*fbm(vec2(p.x*24.,dp*160.)/(1.+k*1.5)+fi*9.);
  g+=vec3(.6,.36,.1)*exp(-dp*(50.-k*30.))*exp(-abs(p.x-sun.x)*2.5)*SV*.5;
  g=mix(g,HZ,(1.-k)*(1.-k)*(.55+.3*uP.y));
  c=mix(c,g,ss(-.0012,.0012,dp));}
 for(int l=0;l<3;l++){float fl=float(l),N=mix(64.,26.,fl*.5),H=mix(.06,.17,fl*.5),by=-.5+(2.-fl)*.045,cx=floor(p.x*N);
  for(int j=-2;j<=2;j++){float id=cx+float(j),r1=h1(id*1.3+fl*71.),r2=h1(id*2.7+fl*31.+.5);
   float bx=(id+.5+(r1-.5)*.9)/N,hh=H*(.45+.75*r2),yr=(p.y-by)/hh;
   if(yr>1.)continue;yr=max(yr,0.);
   float sway=(sin(uT*1.4+bx*8.+r1*6.3)*.3+(n2(vec2(bx*2.-uT*.3*uWind,fl))-.35)*1.6)*uWind;
   float x=bx+((r2-.5)*.25+sway*.2)*hh*yr*yr,w=(.003+.0016*fl)*(1.-yr)+.0005;
   vec3 bc=mix(vec3(.03,.05,.02),vec3(.17,.21,.06),yr*yr)*A*(1.-.2*fl);
   bc+=vec3(.9,.6,.2)*yr*SV*exp(-abs(bx-sun.x)*2.5)*.45;
   c=mix(c,bc,ss(w,w*.4,abs(p.x-x)));}}
 return c;}

vec3 city(vec2 p,vec3 c){
 for(int i=0;i<3;i++){float fi=float(i),k=fi*.5;
  float x=p.x*mix(24.,6.5,k)+fi*37.+200.,id=floor(x),fx=fract(x);
  float r=h1(id+fi*13.1),r2=h1(id*1.7+5.3),r3=h1(id*2.3+9.1);
  float wf=.6+.38*r2,base=hz-.02-k*.2,ht=mix(.04,.1,k)+r*r*mix(.1,.42,k),u=fx/wf,cols=floor(mix(3.,6.,r3)*(1.+k*.6)),orr=r*2.-1.;
  if(u>1.){u=(fx-wf)/(1.-wf);ht*=.3+.4*r3;cols=2.;orr=-orr;}
  else if(r3>.55&&abs(u-.5)<.22)ht+=.012+.02*k;
  float dp=base+ht-p.y;if(dp<0.)continue;
  vec2 w=vec2(u*cols,dp/mix(.007,.019,k)),wi=floor(w),wq=fract(w);
  float pane=ss(.08,.18,wq.x)*ss(.92,.82,wq.x)*ss(.15,.3,wq.y)*ss(.9,.78,wq.y);
  float wr=h1(wi.x*7.3+wi.y*13.7+id*3.1),wr2=h1(wi.x*3.1+wi.y*5.9+id*1.3+.5);
  vec3 wall=mix(vec3(.13,.13,.17),vec3(.045,.045,.06),k)*(.7+.6*r2)*mix(vec3(1.),sunC,.4)*A;
  wall+=sunC*ss(.8,1.,sun.x>p.x?u:1.-u)*SV*.22;
  // Adjacent panes reflect the same sun streak, with small differences in the glass.
  float el=sun.y-hz,ang=(sun.x-p.x)*1.5-el*1.6+.25,orientation=orr-ang;
  float reflectedY=(p.y-base)/ht-(.35+el*1.45);
  float faceGlow=gs(orientation*3.)*gs(reflectedY*2.2);
  float glint=gs((orientation+(wr-.5)*.10)*9.)*gs(reflectedY*5.4);
  float grazing=pow(clamp(abs(orr)*.86,0.,1.),3.);
  vec3 gl=skyCol(vec2(p.x+orr*.25,hz+.025+(p.y-base)*1.18))*(.20+.36*grazing);
  gl+=sunC*(faceGlow*.37+glint*2.25)*SV;
  float indoor=step(mix(.985,.61,ss(.45,1.,uS)),wr2);
  gl=mix(gl,vec3(1.,.74,.42)*(.44+.33*wr),indoor*(1.-glint*.5));
  vec3 b=mix(wall,gl,pane*(.6+.4*step(.3,r3)));
  b=mix(b,HZ,(1.-k)*(1.-k)*(.6+.25*uP.y)+.04);
  c=mix(c,b,ss(0.,.0015,dp));}
 return c;}

vec3 coast(vec2 p,vec3 c){
 float sd=p.x*uWind,cape=ss(.08,.7,sd);
 float hl=hz-.004+cape*(.03+.12*f1(p.x*4.+3.,5));
 c=mix(c,mix(vec3(.16,.17,.2)*A,HZ,.55+.2*uP.y),ss(0.,.002,hl-p.y)*step(hz,p.y));
 if(p.y<hz){
  float d=hz-p.y,pz=1./(d+.05),t=uT*.22,el=sun.y-hz;
  float day=ss(-.05,.02,el)*mix(1.,.7,K);
  vec2 w=vec2(p.x*pz*3.,pz*2.);
  // Long swell, finer ripples and shallow chop move at different rates.
  float l=n2(w*vec2(.35,1.1)+vec2(t*.2,t*.55)+13.);
  float a=n2(w*vec2(1.,3.)+vec2(t*.5,t*1.6)),b=n2(w*vec2(2.3,7.)+vec2(-t*.4,t*2.3)+7.);
  float ripple=ss(.012,.10,d),chop=ss(.065,.19,d);
  vec2 slope=vec2((l-.5)*.14+(a-.5)*.16,(a-.5)*.21+(l-.5)*.16)*ripple;
  slope+=vec2(-.075,.115)*(b-.5)*chop;
  vec3 normal=normalize(vec3(slope.x,1.,slope.y));
  vec3 view=normalize(vec3(-p.x,d,-.9)),light=normalize(vec3(sun.x,max(el,0.),.9));
  vec3 reflected=reflect(-view,normal);
  float cv=clamp(dot(normal,view),0.,1.);
  float fresnel=.02+.98*pow(1.-cv,5.);
  vec2 skyRay=reflected.xy*(.9/max(reflected.z,.25));
  vec3 rf=skyCol(vec2(skyRay.x,hz+max(skyRay.y,.003)));
  vec3 deep=mix(vec3(.04,.10,.15),vec3(.015,.025,.05),K)*A;
  vec3 wc=mix(deep,rf,.22+.76*fresnel)*(.90+.20*l+.14*(a-.5)*ripple);
  // A narrow solar lobe rides on a broad reflection. Dark troughs break up the path.
  float facing=clamp(dot(normal,normalize(view+light+vec3(0.,1e-4,0.))),0.,1.);
  float swell=mix(.22,1.,ss(.34,.65,l))*(.6+.8*b);
  float broad=pow(facing,36.)*(.14+.23*fresnel);
  float spark=pow(facing,310.)*swell*(.62+1.34*fresnel);
  float sparkle=ss(.44,.82,n2(w*vec2(7.,22.)+vec2(t*1.4,t*4.))*(.55+a));
  spark*=mix(.50,.28+1.36*sparkle,chop);
  vec3 glint=sunC*(broad+spark)*day;
  wc+=glint/(1.+dot(glint,vec3(.21)));
  wc*=1.-.35*cape*exp(-d*14.);
  c=wc;
  float sy=hz-.3-sd*.22+f1(p.x*3.+9.,3)*.04;
  float sw=sy+.014+.012*sin(uT*.3+p.x*2.)+n1(p.x*9.+uT*.08)*.01;
  float wet=ss(.075,0.,sw-p.y),gw=.037+d*(.38+.30*uP.y);
  vec3 sand=vec3(.34,.26,.18)*mix(vec3(1.),sunC,.5)*A*(.78+.37*n2(p*vec2(300.,700.)));
  sand*=mix(1.,.49,wet);
  sand=mix(sand,skyCol(vec2(p.x,hz+d*.65))*.62,wet*(.16+.43*fresnel));
  sand+=sunC*gs((p.x-sun.x)/gw)*wet*wet*(.27+.26*l)*day;
  c=mix(c,sand,ss(.002,-.002,p.y-sw));
  float foam=n2(vec2(p.x*145.,(p.y-sw)*470.-t*.7));
  float crest=ss(.0045,.0004,abs(p.y-sw))*mix(.24,.95,ss(.3,.68,foam));
  float lace=ss(.012,.001,abs(p.y-sw-.006))*ss(.62,.87,foam)*.42;
  c+=mix(vec3(.60,.68,.76),sunC,.42)*mix(.62,.23,K)*(crest+lace);}
 return c;}

float mh(float x,float fi,float k){
 float y=hz+.03-k*.3+mix(.27,.13,k)*ridge(x*mix(1.5,2.3,k)+fi*23.7);
 if(fi>3.5)y+=(1.-abs(fract(x*38.+n1(x*6.)*2.)*2.-1.))*.016*(.3+n1(x*11.))*(fi-3.)*.6;
 return y;}
vec3 mountains(vec2 p,vec3 c){
 for(int i=0;i<6;i++){float fi=float(i),k=fi/5.;
  float y=mh(p.x,fi,k),dp=y-p.y;if(dp<-.002)continue;
  float sl=(mh(p.x+.004,fi,k)-y)/.004*sign(sun.x-p.x);
  vec3 m=mix(vec3(.3,.34,.46),vec3(.045,.06,.07),k)*A;
  float sn=ss(.5,.7,(p.y-hz-.03+k*.3)/mix(.27,.13,k)+(n1(p.x*50.+fi*3.)-.5)*.2);
  if(i<2)m=mix(m,vec3(.78,.74,.8)*mix(vec3(1.),sunC,.6)*A,sn*.7);
  m+=sunC*vec3(1.,.7,.5)*ss(.1,1.2,-sl)*.14*SV*(1.-k*.5);
  m=mix(m,HZ,pow(1.-k,1.5)*(.62+.25*uP.y));
  float mi=(1.-exp(-dp*mix(7.,3.,k)))*(.5-.3*k)*(.6+.8*fbm(vec2(p.x*2.5+uT*.012*uWind+fi*5.,p.y*9.)));
  m=mix(m,HZ*mix(1.,.8,k),clamp(mi,0.,.9));
  c=mix(c,m,ss(-.0012,.0012,dp));}
 return c;}

void main(){
 vec2 p=(gl_FragCoord.xy-.5*uR)/uR.y;
 hz=uScene==0?-.13:uScene==1?-.28:uScene==2?-.07:-.2;
 float el=mix(.34,-.075,uS);
 sun=vec2(uP.x*min(1.,uR.x/uR.y)+(uS-.5)*.1*uWind,hz+el);
 K=ss(0.,.9,uS);SV=ss(-.035,.03,el);A=mix(1.,.4,ss(.35,1.,uS));
 sunC=mix(vec3(1.,.97,.90),vec3(1.,.59,.28),ss(.14,-.02,el))*mix(vec3(1.),uTint,.72);
 HZ=skyCol(vec2(p.x,hz+.02));
 vec3 c=skyCol(p);float h=p.y-hz;
 if(h>0.){
  vec2 ds=p-sun;
  float d=length(ds),solarRadius=length(vec2(ds.x,ds.y/mix(.82,1.,ss(0.,.12,el))));
  float disk=ss(.027,.024,solarRadius),G=ss(-.09,0.,el),hf=ss(0.,.06,h);
  vec3 solarDisc=mix(sunC*1.62,mix(sunC,vec3(1.),.28)*2.45,ss(.025,.006,solarRadius));
  c=mix(c,solarDisc,disk);
  c+=sunC*(exp(-d*24.)*.28+exp(-d*7.)*.1)*G;
  float pz=1./(h+.25);
  vec2 q=vec2(p.x*pz,pz*2.4)*uP.w+vec2(uT*.01*uWind,uT*.002);
  vec3 lit=mix(vec3(1.,.93,.8),vec3(1.,.55,.34),K)*mix(vec3(1.),uTint,.6)*mix(1.,.6,ss(.85,1.,uS));
  vec3 shd=mix(vec3(.5,.54,.64),vec3(.2,.18,.28),K)*uSky;
  lit*=mix(vec3(1.),uTint,.56);
  float ci=fbm(vec2(q.x*.5+uT*.004,q.y*3.)+41.);
  c=mix(c,mix(c,lit,.7),ss(.5,.85,ci)*mix(.38,.11,ss(.30,.70,uP.z))*hf);
  vec2 ld=normalize(sun-p+1e-4)*.2;
  float n=fbm(q),nl=fbm(q+vec2(ld.x,-ld.y));
  float dn=ss(uP.z,uP.z+.28,n),li=clamp((n-nl)*3.5+.45,0.,1.);
  float edge=ss(.025,.12,dn)*(1.-ss(.24,.48,dn));
  vec3 cc=mix(shd,lit,li*(.4+.6*exp(-d*2.)))+sunC*exp(-d*9.)*(.33+.42*edge)*(1.-dn*.5)*G;
  c=mix(c,cc,dn*.78*hf*(1.-.45*disk));}
 if(uScene==0)c=meadow(p,c);else if(uScene==1)c=city(p,c);else if(uScene==2)c=coast(p,c);else c=mountains(p,c);
 c=max(c*(1.-.12*dot(p,p)),vec3(0.))*.86;
 c=(c*(2.51*c+.03))/(c*(2.43*c+.59)+.14);
 c+=(h2(gl_FragCoord.xy)-.5)/255.;
 o=vec4(c,1.);}`;
const VERT=`#version 300 es
void main(){vec2 v=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(v*2.-1.,0.,1.);}`;

const SC=['meadow','city','coast','mountains'],JP={meadow:'草原',city:'都市',coast:'海岸',mountains:'山岳'};
const CANON='https://scott2121.github.io/wallpaper-sites/wallpapers/living-sunset/',CYCLE=1800;
const $=id=>document.getElementById(id);
const rng=a=>()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const atmospherePalettes=[
  {tint:[1.04,.95,.82],sky:[.86,1.01,1.20]},
  {tint:[1.06,.86,.77],sky:[1.03,.99,1.06]},
  {tint:[1.03,.83,1.27],sky:[1.14,.91,1.08]},
  {tint:[.98,.85,1.37],sky:[1.09,.89,1.22]},
  {tint:[1.00,1.08,1.04],sky:[.89,1.06,1.09]}
];
function palette(seed){
  const r=rng(seed),weather=rng(seed^0x6a09e667);
  const sunX=(r()-.5)*.6,haze=r(),redShift=r(),cs=.9+r()*.9,wind=r()<.5?-1:1;
  const warmShift=r(),blueShift=r(),fseed=1+r()*90;
  const mood=atmospherePalettes[Math.floor(weather()*atmospherePalettes.length)];
  const cov=.28+.47*Math.pow(weather(),1.12);
  return {sunX,haze,cov,cs,wind,fseed,
    tint:[mood.tint[0]*(.98+redShift*.04),mood.tint[1]*(.96+warmShift*.08),mood.tint[2]*(.94+blueShift*.12)],
    sky:mood.sky.map(channel=>channel*(.96+weather()*.08))};
}

const q=new URLSearchParams(location.search),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const querySeed = q.get('seed');
const randomSeed=()=>Math.floor(Math.random()*2147483648);
const initialSeed = /^\d+$/.test(querySeed ?? '') && Number(querySeed) <= 2147483647 ? Number(querySeed) : randomSeed();
const st={seed:initialSeed,scene:SC.includes(q.get('scene'))?q.get('scene'):'meadow',
  phase:.28,speed:1,paused:reduced,keep:true};
let pal=palette(st.seed),cv=$('c'),gl=null,x2=null,U={},mt=0,raf=0,last=0;
const prog=()=>st.phase;
const say=t=>{$('status').textContent=t};

function initGL(){
  gl=cv.getContext('webgl2',{antialias:false,preserveDrawingBuffer:true,powerPreference:'low-power'});
  if(!gl)return false;
  try{
    const pr=gl.createProgram();
    for(const[t,s]of[[gl.VERTEX_SHADER,VERT],[gl.FRAGMENT_SHADER,FRAG]]){
      const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);
      if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));
      gl.attachShader(pr,sh);}
    gl.linkProgram(pr);
    if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));
    gl.useProgram(pr);
    for(const n of['uR','uT','uS','uSeed','uWind','uScene','uP','uTint','uSky'])U[n]=gl.getUniformLocation(pr,n);
    return true;
  }catch(e){console.warn(e);gl=null;return false}
}
function init(){
  if(initGL()){
    cv.addEventListener('webglcontextlost',e=>{e.preventDefault();gl=null});
    cv.addEventListener('webglcontextrestored',()=>{initGL();kick()});
  }else{
    const n=cv.cloneNode();cv.replaceWith(n);cv=n;x2=cv.getContext('2d');
    say('WebGL2が使えないため簡易描画で表示しています。');
  }
}
function resize(){
  const w=innerWidth,h=innerHeight,s=Math.min(devicePixelRatio||1,1.5,Math.sqrt(2.3e6/(w*h)));
  cv.width=Math.max(2,Math.round(w*s));cv.height=Math.max(2,Math.round(h*s));kick();
}
function draw(){
  if(gl){
    gl.viewport(0,0,cv.width,cv.height);
    gl.uniform2f(U.uR,cv.width,cv.height);gl.uniform1f(U.uT,mt);gl.uniform1f(U.uS,prog());
    gl.uniform1f(U.uSeed,pal.fseed);gl.uniform1f(U.uWind,pal.wind);gl.uniform1i(U.uScene,SC.indexOf(st.scene));
    gl.uniform4f(U.uP,pal.sunX,pal.haze,pal.cov,pal.cs);gl.uniform3fv(U.uTint,pal.tint);
    gl.uniform3fv(U.uSky,pal.sky);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }else if(x2)draw2d();
}

/* Canvas 2D fallback: same seed, palette, sun path and scenes, simplified shading */
function draw2d(){
  const x=x2,w=cv.width,h=cv.height,s=prog(),K=Math.min(1,s/.9),r=rng(st.seed^0x9e37),P=pal,amb=1-.6*Math.max(0,(s-.35)/.65);
  const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t),rgb=(c,a=1)=>`rgba(${c.map(v=>Math.round(Math.max(0,Math.min(1,v))*255))},${a})`;
  const hz=h*{meadow:.63,city:.78,coast:.57,mountains:.7}[st.scene];
  const zen=mix([.14,.29,.59],[.04,.08,.2],K).map((v,i)=>v*P.sky[i]),mid=mix([.44,.58,.78],[.53,.36,.47],K).map((v,i)=>v*P.sky[i]);
  const hor=mix([1,.78,.50],[1,.44,.19],K).map((v,i)=>v*P.tint[i]*(1-.5*Math.max(0,(s-.82)/.18)));
  const sunc=mix([1,.97,.90],[1,.59,.28],K).map((v,i)=>v*(.28+.72*P.tint[i]));
  let g=x.createLinearGradient(0,0,0,hz);g.addColorStop(0,rgb(zen));g.addColorStop(.62,rgb(mid));g.addColorStop(1,rgb(hor));
  x.fillStyle=g;x.fillRect(0,0,w,h);
  const sx=w/2+(P.sunX*Math.min(1,w/h)+(s-.5)*.1*P.wind)*h,sy=hz-(.34-.415*s)*h,R=h*.029;
  g=x.createRadialGradient(sx,sy,0,sx,sy,h*.5);g.addColorStop(0,rgb(hor,.55));g.addColorStop(1,rgb(hor,0));x.fillStyle=g;x.fillRect(0,0,w,hz);
  g=x.createRadialGradient(sx,sy,R*.9,sx,sy,R*3);g.addColorStop(0,rgb(sunc,.5));g.addColorStop(1,rgb(sunc,0));x.fillStyle=g;x.fillRect(0,0,w,hz);
  x.fillStyle=rgb(mix(sunc,[1,1,1],.35));x.beginPath();x.arc(sx,sy,R,0,7);x.fill();
  const cloudRandom=rng(st.seed^0xbb67ae85),cloudCount=Math.round(3+39*(.75-P.cov));
  for(let i=0;i<cloudCount;i++){
    const cx=(((cloudRandom()+mt*.0015*P.wind)%1)+1)%1*w*1.5-w*.25,cy=cloudRandom()*hz*.85,rw=(.12+cloudRandom()*.22)*w,lit=mix(mix([.5,.54,.64],[.2,.18,.28],K),hor,.35+.5*cy/hz);
    x.save();x.translate(cx,cy);x.scale(1,.16);g=x.createRadialGradient(0,0,0,0,0,rw);g.addColorStop(0,rgb(lit,.26+.5*(.75-P.cov)));g.addColorStop(1,rgb(lit,0));
    x.fillStyle=g;x.beginPath();x.arc(0,0,rw,0,7);x.fill();x.restore();}
  const layer=(y0,amp,f,col,sharp)=>{const ph=[r()*9,r()*9,r()*9,r()*9];x.fillStyle=rgb(col);x.beginPath();x.moveTo(0,h);
    for(let i=0;i<=w;i+=3){const u=i/h*f;let v=0;for(let o=0;o<4;o++)v+=Math.sin(u*(1.3+o*1.9)+ph[o])/(o+1);
      v=sharp?1-Math.abs(v)*.9:v*.5;x.lineTo(i,y0-amp*v);}x.lineTo(w,h);x.fill()};
  const hzc=mix(hor,mid,.25);
  if(st.scene==='meadow'){
    for(let i=0;i<5;i++){const k=i/4;layer(hz-h*.03+k*k*h*.2,h*(.02+.04*k),5-k*2.5,mix(mix([.3,.36,.17],[.09,.13,.045],k).map(v=>v*amb),hzc,(1-k)*(1-k)*.7))}
    x.lineCap='round';
    for(let i=0;i<220;i++){const bx=r()*w,bh=h*(.05+r()*.14),sw=(Math.sin(mt*1.4+bx*.01+r()*6)*.25+.3)*P.wind*bh*.3;
      x.strokeStyle=rgb([.05+.1*r(),.08+.1*r(),.03].map(v=>v*amb));x.lineWidth=h*.004;x.beginPath();x.moveTo(bx,h);x.quadraticCurveTo(bx,h-bh*.6,bx+sw,h-bh);x.stroke()}
  }else if(st.scene==='city'){
    for(let l=0;l<3;l++){const k=l/2,base=hz+h*(.02+k*.2);let bx=-r()*h*.1;
      while(bx<w){const bw=h*(.03+r()*.05)*(1+k*2.5),bh=h*((.04+.06*k)+r()*r()*(.1+.32*k)),o=r()*2-1,wall=mix([.13,.13,.17].map(v=>v*amb*(1-.6*k)),hzc,(1-k)*(1-k)*.7);
        x.fillStyle=rgb(wall);x.fillRect(bx,base-bh,bw,h);
        const ang=(sx-bx)/h*1.5-(hz-sy)/h*1.6+.25,sp=Math.exp(-(((o-ang)*3.5)**2))*(sy<hz?1:0),ws=h*(.008+.012*k);
        for(let wy=base-bh+ws*.4;wy<h;wy+=ws)for(let wx=bx+ws*.3;wx<bx+bw-ws*.6;wx+=ws){const q=r();
          x.fillStyle=q>1-.4*Math.max(0,(s-.45)/.55)?rgb([1,.74,.42],.85):rgb(mix(mix(zen,hor,.4).map(v=>v*.4),sunc,sp*(.5+.5*q)),.8*(1-(1-k)*.5));
          x.fillRect(wx,wy,ws*.6,ws*.55)}
        bx+=bw+h*.004}}
  }else if(st.scene==='coast'){
    g=x.createLinearGradient(0,hz,0,h);g.addColorStop(0,rgb(mix(hor,[.1,.2,.3],.25)));g.addColorStop(1,rgb(mix([.06,.15,.22],[.02,.04,.08],K).map(v=>v*amb)));
    x.fillStyle=g;x.fillRect(0,hz,w,h-hz);
    const vis=Math.max(0,Math.min(1,(hz-sy)/(h*.04)+1));
    for(let i=0;i<260;i++){const d=r()*r(),y=hz+d*(h-hz),gw=h*(.02+d*.25),dx=(r()+r()+r()-1.5)*gw*1.4,a=(.5+.5*Math.sin(mt*(1.5+r()*2)+i))*vis;
      x.fillStyle=rgb(sunc,a*.75);x.fillRect(sx+dx,y,h*(.004+d*.03),Math.max(1,h*(.0015+d*.004)))}
    layer(h*1.02,h*.1,1.2,mix([.36,.3,.23],hor,.2).map(v=>v*amb));
  }else for(let i=0;i<6;i++){const k=i/5;layer(hz+h*(k*.3-.03)-h*.12*(1-k*.5),h*(.14-.07*k),3+k*2,mix(mix([.3,.34,.46],[.045,.06,.07],k).map(v=>v*amb),hzc,Math.pow(1-k,1.5)*.75),true)}
}

function frame(now){
  raf=0;
  if(!st.paused && now-last<32){kick();return}
  const dt=Math.min(Math.max((now-last)/1000,0),.1);last=now;
  if(!st.paused){st.phase=(st.phase+dt*st.speed/CYCLE)%1;mt+=dt*Math.min(Math.max(st.speed,.5),2)}
  draw();
  const s=prog();
  cv.style.opacity=st.paused||reduced?1:Math.min(1,Math.min(s,1-s)*100);
  $('sun').value=Math.round(s*1000);$('sunv').textContent=Math.round(s*100)+'%';
  if(!st.paused&&!document.hidden)raf=requestAnimationFrame(frame);
}
function kick(){if(!raf&&!document.hidden)raf=requestAnimationFrame(frame)}

function sync(){
  for(const r of document.querySelectorAll('input[name=scene]'))r.checked=r.value===st.scene;
  $('seed').value=st.seed;$('keep').checked=st.keep;$('speed').value=String(st.speed);
  $('pause').textContent=st.paused?'再生':'一時停止';$('pause').setAttribute('aria-pressed',String(st.paused));
  try{history.replaceState(null,'',`?seed=${st.seed}&scene=${st.scene}`)}catch(e){}
  kick();
}
function setSeed(v){st.seed=Math.min(2147483647,Math.max(0,Math.floor(Number(v))||0));pal=palette(st.seed);sync()}
function setScene(s){st.scene=s;sync();say(`景色: ${JP[s]} / シード ${st.seed}`)}
function regen(){
  const seed=randomSeed();
  if(!st.keep)st.scene=SC[(SC.indexOf(st.scene)+1+seed%3)%4];
  setSeed(seed);say(`再生成しました: ${JP[st.scene]} / シード ${st.seed}`);
}
function togglePause(){st.paused=!st.paused;last=performance.now();sync();say(st.paused?'停止中':'再生中')}
function toggleUI(force){
  const hidden=force??!document.body.classList.contains('hide');
  document.body.classList.toggle('hide',hidden);
  $('show').setAttribute('aria-expanded',String(!hidden));
  (hidden?$('show'):$('hide')).focus({preventScroll:true});
}
function fullscreen(){
  const d=document,el=d.documentElement,cur=d.fullscreenElement||d.webkitFullscreenElement;
  const rq=el.requestFullscreen||el.webkitRequestFullscreen,ex=d.exitFullscreen||d.webkitExitFullscreen;
  const fail=()=>{toggleUI(true);say('全画面を利用できないため、UIを隠して表示します。')};
  try{
    if(cur){ex&&ex.call(d);return}
    if(!rq)return fail();
    const p=rq.call(el);if(p&&p.catch)p.catch(fail);
  }catch(e){fail()}
}
function download(blob,name){
  const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function savePNG(){
  draw();
  try{cv.toBlob(b=>{if(b){download(b,`living-sunset-${st.scene}-${st.seed}.png`);say('PNGを保存しました。')}else say('PNGの生成に失敗しました。')},'image/png')}
  catch(e){say('PNGの生成に失敗しました。')}
}
function saveJSON(){
  const data={name:'夕日 / Living Sunset',seed:st.seed,scene:st.scene,sceneLabel:JP[st.scene],sunProgress:+prog().toFixed(4),speed:st.speed,paused:st.paused,
    keepScene:st.keep,cycleSeconds:CYCLE,renderer:gl?'webgl2':'canvas2d',palette:pal,url:`${CANON}?seed=${st.seed}&scene=${st.scene}`};
  download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`living-sunset-${st.scene}-${st.seed}.json`);say('設定JSONを保存しました。');
}
function copyURL(){
  const url=location.protocol.startsWith('http')?location.href:`${CANON}?seed=${st.seed}&scene=${st.scene}`;
  const fb=()=>say('共有URL: '+url);
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(()=>say('共有URLをコピーしました。'),fb);else fb();
}

$('scenes').addEventListener('change',e=>setScene(e.target.value));
$('seed').addEventListener('change',e=>{setSeed(e.target.value);say(`シード ${st.seed} を適用しました。`)});
$('regen').onclick=regen;
$('keep').onchange=e=>{st.keep=e.target.checked;say(st.keep?'再生成しても景色を保ちます。':'再生成で景色も切り替えます。')};
$('copy').onclick=copyURL;
$('sun').addEventListener('input',e=>{st.phase=Number(e.target.value)/1000;kick()});
$('pause').onclick=togglePause;
$('speed').onchange=e=>{st.speed=parseFloat(e.target.value)||1;kick()};
$('fs').onclick=fullscreen;
$('hide').onclick=()=>toggleUI(true);
$('show').onclick=()=>toggleUI(false);
$('png').onclick=savePNG;
$('json').onclick=saveJSON;
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
  if(e.key==='Escape'){
    if(!document.fullscreenElement&&!document.webkitFullscreenElement)toggleUI();
    return;
  }
  const t=e.target,tag=t.tagName,typing=tag==='SELECT'||(tag==='INPUT'&&t.type==='number');
  if(typing)return;
  const k=e.key.toLowerCase();
  if(k===' '){if(tag==='BUTTON'||tag==='INPUT'||tag==='A')return;e.preventDefault();togglePause()}
  else if(k==='h')toggleUI();
  else if(k==='f')fullscreen();
  else if(k==='r')regen();
  else if(k==='s')savePNG();
  else if(k>='1'&&k<='4')setScene(SC[k-1]);
});
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else{last=performance.now();kick()}});

init();resize();sync();
if(reduced)say('視覚効果を減らす設定のため停止中です。「再生」で開始できます。');
else if(!$('status').textContent)say('キー操作: Space 停止 / 1–4 景色 / R 再生成 / H・Esc 設定 / F 全画面 / S PNG');
</script>
</body>
</html>
