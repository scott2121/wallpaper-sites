<meta name="description" content="夜の森で静かに燃える焚き火のライブ壁紙。ゆらめく炎、赤く光る熾火、煙と火の粉をすべてプロシージャルに描画。薪をくべる・炎をあおる・風向きの調整・パチパチ音に対応しています。">

<style>

<body>
<canvas id="c0"></canvas><canvas id="c1" aria-hidden="true"></canvas>
<canvas id="c2" role="img" aria-label="夜の森で燃える焚き火のアニメーション。左右にドラッグすると風向きが変わります。"></canvas>
<header class="ui">
<h1>焚き火 <span lang="en">Campfire</span></h1>
<p class="sum">夜の森で静かに燃える焚き火のライブ壁紙。薪をくべると落ちて燃え移り、やがて炭になって熾火に還ります。画面を左右にドラッグすると風向きが変わります(キー: L 薪 / A あおる / P 一時停止 / F 全画面)。</p>
<p><span id="stat"></span> ・ <a href="../../">ギャラリーへ戻る</a></p>
<p id="msg" role="status" aria-live="polite"></p>
</header>
<div id="panel" class="ui" role="group" aria-label="焚き火の操作">
<button id="feed" type="button">薪をくべる</button>
<button id="flare" type="button">炎をあおる</button>
<label><input id="auto" type="checkbox" checked>自動で薪をくべる</label>
<label>風<input id="wind" type="range" min="-100" max="100" step="5" value="0" aria-label="風向きと強さ(左から右)"></label>
<button id="snd" type="button" aria-pressed="false">音: オフ</button>
<button id="pause" type="button" aria-pressed="false">一時停止</button>
<button id="fs" type="button">全画面</button>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id),KEY='wallpaper-sites:campfire',MAXL=7,R=Math.random;
const RM=matchMedia('(prefers-reduced-motion: reduce)');let reduced=RM.matches;
RM.addEventListener&&RM.addEventListener('change',e=>reduced=e.matches);
const c0=$('c0'),c1=$('c1'),c2=$('c2'),x0=c0.getContext('2d'),x2=c2.getContext('2d');
if(!x0||!x2){$('msg').textContent='このブラウザでは焚き火を描画できません。';return}
const S={auto:true,wind:0};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
S.auto=S.auto!==false;S.wind=Math.max(-1,Math.min(1,+S.wind||0));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c};
const blob=(a,b)=>{const c=mk(64,64),x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,a);g.addColorStop(.4,b);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return c};
const bHot=blob('rgba(255,235,170,.9)','rgba(255,150,40,.45)'),bWarm=blob('rgba(255,120,30,.7)','rgba(200,40,5,.3)'),bSmoke=blob('rgba(90,88,92,.5)','rgba(60,60,66,.25)');

let W,H,D,U,cx,by,gs,bgD,bgL,T=0,I=.8,em=.8,boost=0,bGoal=0,feedT=0,raf=0,last=0,paused=reduced,statT=0,spAcc=0,fAcc=0;
const logs=[],SP=[],FP=[],EM=[];
/* slots: x, y(up), angle, length, front — units of U around the fire base */
const SL=[[-.04,.07,.06,1.05,1],[.06,.14,-.2,.95,0],[-.26,.25,-.85,.8,0],[.27,.25,.85,.8,0],[.05,.2,.28,.85,1],[-.1,.31,-.5,.7,0],[.12,.34,.55,.7,0]];
{const r=rng(5);for(let i=0;i<90;i++){const a=r()*6.283,d=Math.sqrt(r());EM.push({x:Math.cos(a)*d*.6,y:Math.sin(a)*d*.13,s:.018+r()*.03,ph:r()*9,sp:.4+r()*1.6,v:[0,0,0,0,0,0].map(()=>.6+r()*.5)})}EM.sort((a,b)=>a.y-b.y)}

/* ---------- WebGL2 flames + smoke ---------- */
const VS=`#version 300 es
void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0.,1.);}`;
const FS=`#version 300 es
precision highp float;
uniform vec2 uC;uniform float uU,uT,uI,uW,uF;out vec4 o;
float h(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*n(p);p=p*2.03+vec2(17.1,9.3);a*=.5;}return s;}
float fl(vec2 p,float sd,float hh,float wd,float sp){
 float y=p.y/hh;
 p.x-=uW*.5*y*abs(y)*hh;
 if(y<-.2||y>1.5||abs(p.x)>wd+.45)return 0.;
 float t=uT*sp;
 vec2 w=vec2(fbm(vec2(p.x*2.+sd,p.y*1.5-t*1.2)),fbm(vec2(p.x*2.-sd,p.y*1.5-t*1.5+7.)))-.47;
 vec2 q=p+w*(.16+.5*max(y,0.))*vec2(1.,.5);
 float a=fbm(vec2(q.x*3.6+sd*2.,q.y*1.9-t*2.4));
 float b=fbm(vec2(q.x*9.-sd,q.y*5.-t*4.4));
 float wid=wd*(1.-.72*smoothstep(0.,1.1,y));
 float d=(1.-abs(q.x)/wid)*.85+(a-.47)*1.5+(b-.47)*.5-y*1.2+.3;
 return d*smoothstep(-.1,.08,p.y);
}
vec3 ramp(float d){d=max(d,0.);vec3 c=mix(vec3(.85,.09,0.),vec3(1.,.4,.03),smoothstep(0.,.3,d));
 c=mix(c,vec3(1.,.72,.2),smoothstep(.25,.65,d));c=mix(c,vec3(1.,.95,.75),smoothstep(.6,1.15,d));return c*smoothstep(0.,.16,d);}
void main(){
 vec2 p=(gl_FragCoord.xy-uC)/uU;
 float I=min(uI,1.6),hf=.3+.8*I,wf=.45+.55*min(I,1.);
 vec2 f=p-vec2(0.,.06);
 vec3 c=ramp(fl(f,1.3,1.3*hf,.6*wf,.8))*.65+ramp(fl(f+vec2(.17,-.02),5.7,hf,.42*wf,1.))*.85+ramp(fl(f-vec2(.16,0.),9.1,.85*hf,.4*wf,1.15))*.9;
 float m=max(c.r,max(c.g,c.b));
 c*=(1.-exp(-m*1.6))/max(m,1e-4)*smoothstep(0.,.25,uI);
 float a=clamp(c.r*.85,0.,.9);
 vec2 s=p;s.x-=uW*(.35*p.y+.22*p.y*p.y);
 float sw=.22+.3*max(p.y,0.);
 float sm=fbm(vec2(s.x*1.5,p.y*1.1-uT*.4)+1.3*fbm(vec2(s.x*2.2+3.,p.y*2.-uT*.55)));
 float sa=smoothstep(.4,.85,sm)*exp(-s.x*s.x/(sw*sw))*smoothstep(.35,1.3,p.y)*.34*(.45+.55*min(uI,1.));
 vec3 sc=mix(vec3(.55,.3,.16),vec3(.2,.21,.25),smoothstep(.6,2.2,p.y));
 float g=exp(-(p.x*p.x+(p.y-.4)*(p.y-.4)*.7)*1.5)*.2*min(uI,1.3)*(.85+.15*uF);
 o=vec4(c+sc*sa*(1.-a)+vec3(1.,.36,.07)*g,a+sa*(1.-a));
}`;
let gl=null;const UN={};
try{
 const g=c1.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:false});
 if(g){
  const sh=(t,s)=>{const o=g.createShader(t);g.shaderSource(o,s);g.compileShader(o);if(!g.getShaderParameter(o,g.COMPILE_STATUS))throw Error(g.getShaderInfoLog(o));return o};
  const p=g.createProgram();g.attachShader(p,sh(g.VERTEX_SHADER,VS));g.attachShader(p,sh(g.FRAGMENT_SHADER,FS));g.linkProgram(p);
  if(!g.getProgramParameter(p,g.LINK_STATUS))throw Error('link');
  g.useProgram(p);for(const k of['uC','uU','uT','uI','uW','uF'])UN[k]=g.getUniformLocation(p,k);gl=g;
 }
}catch(e){gl=null}
if(!gl)c1.style.display='none';
c1.addEventListener('webglcontextlost',e=>{e.preventDefault();gl=null;c1.style.display='none'});

/* ---------- static scene (dark + fire-lit versions) ---------- */
function pine(c,x,b,h,w){c.beginPath();c.moveTo(x,b-h);const n=6;
 for(let i=1;i<=n;i++){const y=b-h+h*i/n,ww=w*i/n;c.lineTo(x+ww,y);c.lineTo(x+ww*.5,y)}
 for(let i=n;i>=1;i--){const y=b-h+h*i/n,ww=w*i/n;c.lineTo(x-ww*.5,y);c.lineTo(x-ww,y)}
 c.fill()}
function paint(lit){
 const cv=mk(W*D,H*D),c=cv.getContext('2d'),r=rng(11),hz=H*.6;c.scale(D,D);
 let g=c.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#02040b');g.addColorStop(1,lit?'#171320':'#0b1022');c.fillStyle=g;c.fillRect(0,0,W,hz+2);
 for(let i=0;i<170;i++){const x=r()*W,y=r()*r()*hz,s=.5+r()*1.2,a=.2+r()*.7;c.fillStyle=`rgba(${200+r()*55|0},${210+r()*40|0},255,${lit?a*.7:a})`;c.fillRect(x,y,s,s)}
 c.fillStyle=lit?'#0c0b10':'#060810';
 let n=Math.ceil(W/38)+2;
 for(let i=0;i<n;i++){const x=(i+r()*.8-.4)/(n-1)*W,h=H*.17*(.6+r()*.7);pine(c,x,hz+H*.01,h,h*.24)}
 c.fillRect(0,hz-H*.015,W,H*.03);
 g=c.createLinearGradient(0,hz,0,H);g.addColorStop(0,lit?'#120c09':'#06070b');g.addColorStop(1,lit?'#070504':'#020203');c.fillStyle=g;c.fillRect(0,hz,W,H-hz);
 if(lit){c.save();c.beginPath();c.rect(0,hz,W,H-hz);c.clip();c.translate(cx,by);c.scale(1,.34);
  g=c.createRadialGradient(0,0,U*.2,0,0,U*3.2);g.addColorStop(0,'rgba(255,150,60,.6)');g.addColorStop(.3,'rgba(220,95,30,.3)');g.addColorStop(1,'rgba(120,40,10,0)');
  c.fillStyle=g;c.fillRect(-U*3.3,-U*3.3,U*6.6,U*6.6);c.restore()}
 for(let i=0;i<700;i++){const x=r()*W,k=r(),y=hz+k*(H-hz),s=1+k*3*r(),d=r();
  c.fillStyle=d<.5?'rgba(0,0,0,.28)':lit?'rgba(255,190,130,.07)':'rgba(140,160,200,.04)';c.fillRect(x,y,s*2,s*.7)}
 c.lineWidth=1.2;
 for(let i=0;i<150;i++){const x=r()*W,k=Math.pow(r(),1.5),y=hz+H*.02+k*(H-hz),h=3+k*10*r(),dx=(r()-.5)*5;
  const b=lit?Math.max(0,1-Math.hypot(x-cx,(y-by)*2.5)/(U*3)):0;
  c.strokeStyle=`rgba(${14+150*b|0},${18+80*b|0},${22+20*b|0},.7)`;c.beginPath();c.moveTo(x,y);c.lineTo(x+dx,y-h);c.stroke()}
 n=Math.ceil(W/70)+2;const clr=Math.min(U*1.4,W*.3);
 for(let i=0;i<n;i++){const x=(i+r()*.8-.4)/(n-1)*W,h=H*.3*(.6+r()*.7);if(Math.abs(x-cx)<clr)continue;
  const b=lit?Math.max(0,1-Math.abs(x-cx)/(W*.6)):0;c.fillStyle=`rgb(${6+36*b|0},${7+17*b|0},${11+5*b|0})`;pine(c,x,hz+H*.05,h,h*.24)}
 c.beginPath();c.ellipse(cx,by+U*.03,U*.8,U*.21,0,0,7);c.fillStyle=lit?'#1b1512':'#08080a';c.fill();
 const st=[];for(let i=0;i<14;i++){const a=i/14*6.283+r()*.2;st.push({x:cx+Math.cos(a)*U*.86,y:by+U*.03+Math.sin(a)*U*.24,s:U*(.1+r()*.05),sd:r()*1e6|0})}
 st.sort((a,b)=>a.y-b.y);c.lineWidth=1;
 for(const s of st){const q=rng(s.sd),Y=s.y-s.s*.45;c.beginPath();
  for(let j=0;j<9;j++){const a=j/9*6.283,rr=s.s*(.8+q()*.35);c.lineTo(s.x+Math.cos(a)*rr*1.25,Y+Math.sin(a)*rr*.8)}
  c.closePath();
  if(lit){const dx=cx-s.x,dy=by-U*.2-s.y,m=Math.hypot(dx,dy)||1,ux=dx/m*s.s,uy=dy/m*s.s;
   g=c.createLinearGradient(s.x+ux,Y+uy,s.x-ux,Y-uy);g.addColorStop(0,'#a8683c');g.addColorStop(.5,'#4a2f20');g.addColorStop(1,'#120d0b');c.fillStyle=g}
  else c.fillStyle='#0b0c11';
  c.fill();c.strokeStyle='rgba(0,0,0,.5)';c.stroke()}
 return cv}

/* ---------- logs: bark / charred / glow sprites ---------- */
function logSpr(l){
 const L=l.len*U,Rr=l.d*U/2,p=Rr*.9,w=L+2*p,h=2*Rr+2*p,q=rng(l.seed),e=Rr*.42;let g;
 const path=c=>{c.beginPath();c.ellipse(-L/2+e,0,e,Rr,0,Math.PI/2,Math.PI*1.5);c.ellipse(L/2-e,0,e,Rr,0,-Math.PI/2,Math.PI/2);c.closePath()};
 const mkc=()=>{const cv=mk(w*D,h*D),c=cv.getContext('2d');c.scale(D,D);c.translate(w/2,h/2);return[cv,c]};
 const cap=(c,a,b,ring)=>{c.beginPath();c.ellipse(L/2-e,0,e*.92,Rr*.94,0,0,7);g=c.createRadialGradient(L/2-e,0,0,L/2-e,0,Rr);g.addColorStop(0,a);g.addColorStop(1,b);c.fillStyle=g;c.fill();
  c.strokeStyle=ring;c.lineWidth=Rr*.04;for(let i=1;i<4;i++){c.beginPath();c.ellipse(L/2-e,0,e*.23*i,Rr*.23*i,0,0,7);c.stroke()}};
 const [B,c]=mkc();path(c);c.save();c.clip();
 g=c.createLinearGradient(0,-Rr,0,Rr);g.addColorStop(0,'#6d4a30');g.addColorStop(.35,'#553722');g.addColorStop(1,'#1d120b');c.fillStyle=g;c.fillRect(-w/2,-Rr,w,2*Rr);
 for(let i=0;i<70;i++){const x=-L/2+q()*L,y=-Rr+q()*2*Rr,ln=L*(.05+q()*.2);
  c.strokeStyle=q()<.6?`rgba(15,8,4,${.25+q()*.4})`:`rgba(190,140,95,${.08+q()*.15})`;c.lineWidth=Rr*(.04+q()*.1);
  c.beginPath();c.moveTo(x,y);c.bezierCurveTo(x+ln*.3,y+(q()-.5)*Rr*.3,x+ln*.6,y+(q()-.5)*Rr*.3,x+ln,y+(q()-.5)*Rr*.2);c.stroke()}
 c.restore();cap(c,'#c79a63','#8a6238','rgba(70,40,15,.5)');
 const [C,k]=mkc();path(k);k.save();k.clip();
 g=k.createLinearGradient(0,-Rr,0,Rr);g.addColorStop(0,'#2a2522');g.addColorStop(.4,'#14110f');g.addColorStop(1,'#050404');k.fillStyle=g;k.fillRect(-w/2,-Rr,w,2*Rr);
 for(let i=0;i<50;i++){const v=150+q()*80|0;k.fillStyle=`rgba(${v},${v-6},${v-12},${.04+q()*.12})`;k.fillRect(-L/2+q()*L,-Rr+q()*2*Rr,Rr*(.1+q()*.5),Rr*(.05+q()*.15))}
 k.restore();cap(k,'#2b211b','#0b0807','rgba(0,0,0,.6)');
 const [G,m]=mkc();m.lineCap='round';m.shadowColor='#ff5a10';m.shadowBlur=Rr*.5*D;
 for(let i=0;i<5;i++){let y=-Rr*.8+i*Rr*.4+(q()-.5)*Rr*.2,x=-L/2+e;m.beginPath();m.moveTo(x,y);
  while(x<L/2-e*2){x+=Rr*(.3+q()*.5);y+=(q()-.5)*Rr*.22;q()<.8?m.lineTo(x,y):m.moveTo(x,y)}
  m.strokeStyle=`rgba(255,${120+q()*90|0},40,${.5+q()*.4})`;m.lineWidth=Rr*(.05+q()*.07);m.stroke()}
 for(let i=0;i<L/Rr*2.2;i++){const x=-L/2+e+q()*(L-3*e),y=-Rr*.85+q()*Rr*1.3,hh=Rr*(.2+q()*.35);
  m.beginPath();m.moveTo(x,y);m.lineTo(x+(q()-.5)*Rr*.2,y+hh);m.strokeStyle=`rgba(255,${110+q()*90|0},35,${.4+q()*.4})`;m.lineWidth=Rr*(.04+q()*.05);m.stroke()}
 m.shadowBlur=0;g=m.createLinearGradient(0,Rr*.2,0,Rr*1.25);g.addColorStop(0,'rgba(255,90,20,0)');g.addColorStop(.75,'rgba(255,120,30,.75)');g.addColorStop(1,'rgba(255,60,10,0)');
 m.fillStyle=g;m.fillRect(-L/2+e,Rr*.2,L-2*e,Rr*1.05);
 return[B,C,G]}
function drawLog(c,l,light){
 const s=l.spr||(l.spr=logSpr(l)),k=Math.min(1,l.fuel/.22),al=Math.min(1,l.age*3)*k,w=s[0].width/D,h=s[0].height/D;
 c.save();c.translate(cx+l.x*U,by-(l.y+l.oy)*U+(1-k)*U*.05);c.rotate(l.a+l.oa*Math.min(1,l.oy/1.5));c.scale(l.flip,.55+.45*k);
 c.globalAlpha=al;c.drawImage(s[0],-w/2,-h/2,w,h);
 c.globalAlpha=al*Math.max(l.char,(1-light)*.8);c.drawImage(s[1],-w/2,-h/2,w,h);
 c.globalCompositeOperation='lighter';c.globalAlpha=al*Math.min(1,l.heat*l.heat*(.75+.25*Math.sin(T*3+l.seed)));c.drawImage(s[2],-w/2,-h/2,w,h);
 c.restore()}
function addLog(o){
 const used=logs.map(l=>l.slot),i=SL.findIndex((s,j)=>!used.includes(j));if(i<0||logs.length>=MAXL)return false;
 const s=SL[i];
 logs.push(Object.assign({slot:i,x:s[0]+(R()-.5)*.04,y:s[1],a:s[2]+(R()-.5)*.08,len:s[3]*(.92+R()*.16),front:s[4],d:.14+R()*.04,seed:R()*1e9|0,flip:R()<.5?1:-1,
  heat:0,char:0,fuel:1,burn:1/(95+R()*70),age:0,oy:reduced?0:1.5,vy:0,oa:(R()-.5)*1.2,land:reduced?1:0,spr:null},o));
 logs.sort((a,b)=>a.slot-b.slot);feedT=0;return true}
[[.9,.6,.7],[.8,.5,.8],[.6,.3,.9],[.5,.2,1]].forEach(v=>addLog({heat:v[0],char:v[1],fuel:v[2],oy:0,land:1,age:1}));

/* ---------- sparks ---------- */
const maxSp=()=>reduced?40:160;
function spark(x,y,v){if(SP.length>=maxSp())return;const m=1.2+R()*2.6;
 SP.push({x,y,px:x,py:y,vx:(R()-.5)*U*.5,vy:-U*(.5+R()*1.1)*v,l:m,m,s:.7+R()*1.5,ph:R()*9})}

/* ---------- Canvas 2D flame fallback (no WebGL2) ---------- */
function fallback(dt,wind,fi){
 fAcc=Math.min(5,fAcc+dt*(reduced?35:90)*(.25+fi));
 while(fAcc>1&&FP.length<260){fAcc--;const sm=R()<.07;
  FP.push({x:cx+(R()-.5)*U*.9*(.4+.6*Math.min(1,fi)),y:by-U*(sm?.6:.08),vy:-U*(sm?.35:(.55+R()*.9)*(.5+.6*fi)),l:0,m:sm?4:.5+R()*.6,s:U*(sm?.3:.15+R()*.14),sm,ph:R()*9})}
 for(let i=FP.length;i--;){const p=FP[i];p.l+=dt;if(p.l>=p.m){FP.splice(i,1);continue}
  const k=p.l/p.m;p.y+=p.vy*dt;p.x+=((p.sm?0:(cx-p.x)*.9)+wind*U*(p.sm?.5:.7*k)+Math.sin(T*5+p.ph)*U*.08)*dt;
  const s=p.sm?p.s*(1+k*2):p.s*(1-k*.7);
  x2.globalCompositeOperation=p.sm?'source-over':'lighter';x2.globalAlpha=p.sm?.25*Math.sin(k*3.14):(1-k)*.55;
  x2.drawImage(p.sm?bSmoke:k<.4?bHot:bWarm,p.x-s,p.y-s,s*2,s*2)}
 x2.globalAlpha=1;x2.globalCompositeOperation='source-over'}

/* ---------- opt-in synthesized crackle ---------- */
let AC=null,master,nb,snd=false;
function initAudio(){try{
 AC=new(window.AudioContext||window.webkitAudioContext)();
 nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;
 master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nb;s.loop=true;f.type='lowpass';f.frequency.value=240;g.gain.value=.9;
 s.connect(f);f.connect(g);g.connect(master);s.start();return true}catch(e){AC=null;return false}}
function pop(){const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
 s.buffer=nb;s.playbackRate.value=.5+R()*1.5;f.type='bandpass';f.frequency.value=700+R()*R()*5000;f.Q.value=1.5;
 const v=.05+Math.pow(R(),3)*.6,d=.008+R()*.05;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);
 s.connect(f);f.connect(g);g.connect(master);s.start(t,R()*1.8,d+.02)}

/* ---------- simulation + render ---------- */
function render(dt){
 T+=dt*(reduced?.45:1);
 const wind=S.wind+Math.sin(T*.31)*.08+Math.sin(T*.13+2)*.06;
 let heat=0,fuel=0;
 for(let i=logs.length;i--;){const l=logs[i];l.age+=dt;
  if(!l.land){l.vy+=7*dt;l.oy-=l.vy*dt;
   if(l.oy<=0){l.oy=0;if(l.vy>1.6){l.vy*=-.28;for(let j=0;j<6;j++)spark(cx+(l.x+(R()-.5)*l.len*.6)*U,by-l.y*U,.7)}else l.land=1}}
  else{l.heat=Math.min(1,l.heat+dt*(.012+.03*I+.08*boost));l.char=Math.min(1,l.char+dt*l.heat*.035);l.fuel-=dt*l.heat*l.burn}
  if(l.fuel<=0){logs.splice(i,1);continue}
  heat+=l.heat*Math.min(1,l.fuel*4);fuel+=l.fuel}
 I+=(Math.max(.04,Math.min(1.1,heat/3))-I)*dt*.6;
 bGoal*=Math.exp(-dt/1.8);boost+=(bGoal-boost)*Math.min(1,dt*2.5);
 feedT+=dt;if(S.auto&&feedT>7&&(logs.length<4||fuel<2.2))addLog();
 const fi=I+boost*.45,flick=.5+.25*Math.sin(T*9.1)+.15*Math.sin(T*14.7+1)+.1*Math.sin(T*23.3);
 const light=Math.min(1,(.1+.9*Math.min(1,fi))*(reduced?.96+.04*flick:.88+.12*flick));
 em+=(Math.max(.22,Math.min(1,I+boost*.3))-em)*dt*.3;

 x0.globalAlpha=1;x0.drawImage(bgD,0,0,W,H);x0.globalAlpha=light;x0.drawImage(bgL,0,0,W,H);x0.globalAlpha=1;
 for(const e of EM){const sn=.5+.5*Math.sin(T*e.sp+e.ph),b=em*(.3+.7*sn*sn),X=cx+e.x*U,Y=by-U*.02+e.y*U,s=e.s*U;
  x0.fillStyle=`rgb(${30+225*b|0},${14+150*b*b|0},${8+50*b*b*b|0})`;x0.beginPath();
  for(let j=0;j<6;j++){const a=j/6*6.283;x0.lineTo(X+Math.cos(a)*s*e.v[j],Y+Math.sin(a)*s*.6*e.v[j])}
  x0.fill()}
 x0.globalCompositeOperation='lighter';x0.globalAlpha=.55*em;x0.drawImage(bWarm,cx-U*.8,by-U*.25,U*1.6,U*.45);
 x0.globalCompositeOperation='source-over';x0.globalAlpha=1;
 for(const l of logs)if(!l.front)drawLog(x0,l,light);

 if(gl){gl.uniform2f(UN.uC,cx*gs,(H-by)*gs);gl.uniform1f(UN.uU,U*gs);gl.uniform1f(UN.uT,T);gl.uniform1f(UN.uI,fi);gl.uniform1f(UN.uW,wind);gl.uniform1f(UN.uF,flick);gl.drawArrays(gl.TRIANGLES,0,3)}

 x2.clearRect(0,0,W,H);
 if(!gl)fallback(dt,wind,fi);
 for(const l of logs)if(l.front)drawLog(x2,l,light);
 spAcc=Math.min(8,spAcc+(1.5+10*I+45*boost)*(reduced?.4:1)*dt);
 while(spAcc>1){spAcc--;spark(cx+(R()-.5)*U*.6,by-U*(.1+R()*.4),1+boost*.5)}
 x2.globalCompositeOperation='lighter';x2.lineCap='round';
 for(let i=SP.length;i--;){const p=SP[i];p.l-=dt;if(p.l<=0||p.y<-20){SP.splice(i,1);continue}
  p.px=p.x;p.py=p.y;p.vx+=((wind*U*.9-p.vx)*.7+Math.sin(T*3+p.ph)*U*.5)*dt;p.vy+=(-U*.12-p.vy*.35)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  const k=p.l/p.m;x2.strokeStyle=`rgba(255,${90+150*k|0},${30+90*k*k|0},${Math.min(1,k*2.5)})`;x2.lineWidth=p.s*(.5+.5*k)*(U/300+.5);
  x2.beginPath();x2.moveTo(p.px,p.py);x2.lineTo(p.x,p.y+.01);x2.stroke()}
 x2.globalCompositeOperation='source-over';

 if(snd&&AC&&dt&&R()<dt*(1.5+9*Math.min(1.3,fi)))pop();
 statT-=dt;if(statT<=0){statT=.5;$('stat').textContent=`薪 ${logs.length}/${MAXL} ・ 火の粉 ${SP.length}/${maxSp()}`}
}
function tick(now){
 raf=requestAnimationFrame(tick);
 if(now-last<32)return;
 const dt=Math.min(.1,(now-last)/1000);last=now;render(dt);
}
function start(){if(!raf&&!paused&&!document.hidden){last=performance.now();raf=requestAnimationFrame(tick)}}
function stop(){cancelAnimationFrame(raf);raf=0}
function resize(){
 W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);D=Math.min(devicePixelRatio||1,2,Math.max(1,2400/Math.max(W,H)));
 U=Math.min(W,H*.8)*.42;cx=W/2;by=H*.8;
 for(const c of[c0,c2]){c.width=W*D;c.height=H*D}
 x0.setTransform(D,0,0,D,0,0);x2.setTransform(D,0,0,D,0,0);
 gs=Math.min(1,1100/Math.max(W,H));c1.width=W*gs;c1.height=H*gs;if(gl)gl.viewport(0,0,c1.width,c1.height);
 bgD=paint(0);bgL=paint(1);logs.forEach(l=>l.spr=null);statT=0;
 if(!raf)render(0)}

/* ---------- UI ---------- */
let msgT,idleT,rsT,drag=null;
const say=m=>{$('msg').textContent=m;clearTimeout(msgT);msgT=setTimeout(()=>$('msg').textContent='',4000)};
const wake=()=>{document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),5000)};
['pointermove','pointerdown','keydown','focusin','touchstart','wheel'].forEach(e=>addEventListener(e,wake,{passive:true}));
const feed=()=>{say(addLog()?'薪をくべました':`薪はいっぱいです(最大${MAXL}本)`);statT=0;if(!raf)render(0)};
const flare=()=>{bGoal=Math.min(1,bGoal+(reduced?.3:.7));say('炎をあおりました')};
const togglePause=()=>{paused=!paused;$('pause').setAttribute('aria-pressed',paused);$('pause').textContent=paused?'再開':'一時停止';
 if(paused)stop();else start();if(AC)try{paused?AC.suspend():snd&&AC.resume()}catch(e){}};
const de=document.documentElement,rq=de.requestFullscreen||de.webkitRequestFullscreen,ex=document.exitFullscreen||document.webkitExitFullscreen;
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const fsUpd=()=>{if(rq)$('fs').textContent=fsEl()?'全画面を終了':'全画面'};
const toggleFs=()=>{if(!rq)return;try{const p=fsEl()?ex.call(document):rq.call(de);if(p&&p.catch)p.catch(()=>say('全画面にできませんでした'))}catch(e){say('全画面にできませんでした')}};
if(!rq){$('fs').disabled=true;$('fs').textContent='全画面は非対応'}
['fullscreenchange','webkitfullscreenchange'].forEach(e=>document.addEventListener(e,fsUpd));
$('feed').onclick=feed;$('flare').onclick=flare;$('pause').onclick=togglePause;$('fs').onclick=toggleFs;
$('auto').checked=S.auto;$('auto').onchange=e=>{S.auto=e.target.checked;save()};
$('wind').value=Math.round(S.wind*100);$('wind').oninput=e=>{S.wind=e.target.value/100;save()};
$('snd').onclick=()=>{snd=!snd;if(snd&&!AC&&!initAudio()){snd=false;say('この環境では音声を利用できません')}
 if(AC){try{if(snd&&!paused)AC.resume()}catch(e){}master.gain.setTargetAtTime(snd?.5:0,AC.currentTime,.2)}
 $('snd').setAttribute('aria-pressed',snd);$('snd').textContent=snd?'音: オン':'音: オフ'};
c2.addEventListener('pointerdown',e=>{drag={x:e.clientX,w:S.wind};try{c2.setPointerCapture(e.pointerId)}catch(_){}});
c2.addEventListener('pointermove',e=>{if(!drag)return;S.wind=Math.max(-1,Math.min(1,drag.w+(e.clientX-drag.x)/W*2.5));$('wind').value=Math.round(S.wind*100)});
const endDrag=()=>{if(drag){drag=null;save()}};c2.addEventListener('pointerup',endDrag);c2.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.repeat||(e.target.matches&&e.target.matches('input')))return;
 const k=e.key.toLowerCase();if(k==='l')feed();else if(k==='a')flare();else if(k==='p')togglePause();else if(k==='f')toggleFs()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();if(AC)try{AC.suspend()}catch(e){}}else{start();if(AC&&snd&&!paused)try{AC.resume()}catch(e){}}});
addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(resize,120)});
if(paused){$('pause').setAttribute('aria-pressed','true');$('pause').textContent='再開'}
resize();wake();start();
})();
</script>
</body>
</html>
