<body>
<canvas id="c0"></canvas><canvas id="c1" aria-hidden="true"></canvas>

<header id="intro" class="ui">
<h1>焚き火 <span lang="en">Campfire</span></h1>
<p class="sum">夜の森で静かに燃える焚き火。薪は燃えながら小さくなり、熾火になります。油をかける演出では火が一時的に強まります。画面を左右にドラッグすると風向きが変わります。</p>

<script>
(()=>{
const $=id=>document.getElementById(id),KEY='wallpaper-sites:campfire',MAXL=7,R=Math.random;
const RM=matchMedia('(prefers-reduced-motion: reduce)');let reduced=RM.matches;
RM.addEventListener&&RM.addEventListener('change',e=>reduced=e.matches);
const c0=$('c0'),c1=$('c1'),c2=$('c2'),x0=c0.getContext('2d'),x2=c2.getContext('2d');
if(!x0||!x2){$('msg').textContent='このブラウザでは焚き火を描画できません。';return}
const S={auto:true,wind:0};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
S.auto=S.auto!==false;S.wind=Math.max(-1,Math.min(1,+S.wind||0));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c};
const blob=(a,b)=>{const c=mk(64,64),x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,a);g.addColorStop(.4,b);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return c};
const bWarm=blob('rgba(255,120,30,.7)','rgba(200,40,5,.3)'),bSmoke=blob('rgba(90,88,92,.5)','rgba(60,60,66,.25)');

let W,H,D,U,cx,by,gs,bgD,bgL,T=0,I=.8,em=.8,boost=0,bGoal=0,feedT=0,raf=0,last=0,paused=reduced,statT=0,spAcc=0,fAcc=0,pourAge=null;
const logs=[],SP=[],FP=[],EM=[];
// Each lane stores the position and strength of the hot wood beneath it.
const fireRoots=new Float32Array(9);
const fireLaneWidth=.30;
let pourX=0,pourY=.15,oilX=0,oilY=0,oilFlashAge=Infinity;
/* slots: x, y(up), angle, length, front — units of U around the fire base */
const SL=[[-.06,.065,.06,1.05,1],[.17,.135,-.25,.8,1],[-.26,.25,-.85,.8,0],[.27,.25,.85,.8,0],[.05,.2,.28,.85,1],[-.1,.31,-.5,.7,0],[.12,.34,.55,.7,0]];
{
 const r=rng(5);
 for(let i=0;i<64;i++){
  const angle=r()*2*Math.PI,distance=Math.sqrt(r()),shape=new Path2D(),crack=new Path2D();
  for(let j=0;j<7;j++){
   const a=j*2*Math.PI/7,radius=.53+r()*.57,x=Math.cos(a)*radius,y=Math.sin(a)*radius;
   if(j===0)shape.moveTo(x,y);else shape.lineTo(x,y);
  }
  shape.closePath();
  crack.moveTo(-.64,(r()-.5)*.4);
  crack.lineTo(-.24,(r()-.5)*.8);
  crack.lineTo(.17,(r()-.5)*.9);
  crack.lineTo(.55,(r()-.5)*.5);
  EM.push({x:Math.cos(angle)*distance*.59,y:Math.sin(angle)*distance*.13,
   size:.007+r()**2*.027,phase:r()*9,pulse:.45+r()*1.9,shape,crack});
 }
 EM.sort((a,b)=>a.y-b.y);
}

/* ---------- WebGL2 flames + smoke ---------- */
const VS=`#version 300 es
void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0.,1.);}`;
const FS=`#version 300 es
precision highp float;
uniform vec2 uC;uniform float uU,uT,uI,uW,uF;
uniform vec3 uRoots[3],uOil;
out vec4 o;
float h(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*n(p);p=p*2.03+vec2(17.1,9.3);a*=.5;}return s;}
vec2 flameField(vec2 p,float seed,float height,float width){
 float y=p.y/height;
 if(y<-.12||y>1.27||abs(p.x)>width+.44)return vec2(0.);
 float rise=max(y,0.),t=uT*(.92+.022*seed);
 float curl=fbm(vec2(seed+p.x*1.7,rise*3.4-t*1.9));
 // Motion grows above the log, keeping the base attached in a gust.
 float bend=height*rise*(uW*.24*rise+.11*sin(5.1*rise-t*2.+seed)+.49*(curl-.46));
 float taper=1.-.82*smoothstep(.05,1.24,rise);
 float x=(p.x-bend)/(width*taper*(.85+.36*curl));
 float folds=fbm(vec2(x*1.8+seed,rise*3.8-t*2.6));
 float ripples=n(vec2(x*4.2-folds*1.6+seed,rise*8.5-t*6.4));
 float boundary=abs(x)+(folds-.47)*.69+(ripples-.5)*.17;
 float softness=mix(.28,.075,smoothstep(.40,.67,folds+.15*ripples));
 float edge=1.-smoothstep(.91-softness,.91+softness*.63,boundary);
 // Gaps in the rising sheet open more often where the tip is thinner.
 float pocket=smoothstep(.23+.14*rise,.61+.10*rise,folds+.15*(ripples-.45));
 float tip=1.-smoothstep(.73+.12*curl,1.02+.15*folds,y);
 float gate=smoothstep(-.075,.064,y)*tip;
 float density=edge*gate*mix(.045,.99,pocket);
 float crease=x*2.75+.84*sin(5.8*rise-t*2.8+seed)+2.8*(folds-.48);
 float inner=exp(-crease*crease);
 float temperature=clamp(.59*inner+.63*folds+.14*ripples-.55*rise,0.,1.);
 return vec2(density,temperature);
}
vec4 flameAt(vec2 p,vec3 root,float seed,float scale,float turbulence){
 float heat=root.z;
 if(heat<.01)return vec4(0.);
 float flare=smoothstep(.75,1.47,uI);
 float surge=n(vec2(uT*1.38,seed*3.7));
 float height=(.22+.57*heat+.23*flare)*scale*mix(.79,1.14,surge);
 float width=.12+.17*heat;
 vec2 field=flameField(p-root.xy,seed,height,width);
 float temperature=field.y*(.83+.17*heat);
 vec3 amber=mix(vec3(.85,.25,.048),vec3(1.,.72,.31),smoothstep(.09,.59,temperature));
 vec3 color=mix(amber,vec3(1.,.97,.84),smoothstep(.48,.86,temperature));
 float alpha=(1.-exp(-2.55*field.x*(.38+.62*heat)*turbulence))*.93;
 return vec4(color*alpha,alpha);
}
vec4 oilFlame(vec2 p,float turbulence){
 float flash=uOil.z;
 if(flash<.01)return vec4(0.);
 vec2 field=flameField(p-uOil.xy,11.4,(.43+1.04*flash)*(.88+.22*turbulence),.14+.25*flash);
 float a=(1.-exp(-3.9*field.x))*flash;
 vec3 color=mix(vec3(1.,.38,.067),vec3(1.,.99,.89),smoothstep(.08,.77,field.y));
 return vec4(color*a,a);
}
void main(){
 vec2 p=(gl_FragCoord.xy-uC)/uU;
 float heat=uRoots[0].z+uRoots[1].z+uRoots[2].z;
 if(heat+uOil.z<.01||p.y<-.15||p.y>2.8||abs(p.x)>1.35+abs(uW)*.26*p.y*p.y){o=vec4(0.);return;}
 vec2 center=(uRoots[0].xy*uRoots[0].z+uRoots[1].xy*uRoots[1].z+uRoots[2].xy*uRoots[2].z)/max(heat,.01);

 // Wind deflects the rising plume while leaving the base on the wood.
 vec2 s=p-center;
 s.x-=uW*(.21*s.y+.18*s.y*s.y);
 float w=fbm(vec2(s.x*2.2+3.,s.y*2.-uT*.55));

 // Premultiplied sheets overlap, leaving the shaded bark visible in gaps.
 vec4 farFlame=flameAt(p,uRoots[0],1.3,.89,.76+.54*w);
 vec4 middleFlame=flameAt(p,uRoots[1],5.7,1.04,1.17-.39*w);
 vec4 nearFlame=flameAt(p,uRoots[2],9.1,.83,.72+.48*w);
 vec4 layers=middleFlame+farFlame*(1.-middleFlame.a);
 layers=nearFlame+layers*(1.-nearFlame.a);
 float burn=smoothstep(.025,.62,heat);
 layers*=burn;
 vec4 flash=oilFlame(p,w);
 layers=flash+layers*(1.-flash.a);
 float a=layers.a;
 vec3 flame=layers.rgb;

 // smoke: wider threshold and gentler warp for softer breakup
 float sw=.21+.28*max(s.y,0.);
 float sm=fbm(vec2(s.x*1.5,s.y*1.1-uT*.4)+w);
 float sa=smoothstep(.31,.91,sm)*exp(-s.x*s.x/(sw*sw))*smoothstep(.24,.99,s.y)*.25*burn*(1.-smoothstep(1.3,2.6,s.y));
 vec3 sc=mix(vec3(.48,.25,.13)*(.85+.15*uF),vec3(.20,.21,.25),smoothstep(.48,2.,s.y));

 // glow: flickers with uF, shimmers with turbulence, carries its own coverage
 vec2 glow=p-center-vec2(0.,.12);
 float g=exp(-(glow.x*glow.x+glow.y*glow.y*1.8)*3.1)*.17*burn*min(uI,1.3)*(.75+.25*uF)*(.8+.4*w);
 float alpha=a+sa*(1.-a);
 vec3 rgb=flame+sc*sa*(1.-a);
 // Give the glow its own coverage, keeping every layer premultiplied.
 o=vec4(rgb+vec3(.86,.31,.075)*g*(1.-alpha),alpha+g*(1.-alpha));
}`;
let gl=null;const UN={};
try{
 const g=c1.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:false});
 if(g){
  const sh=(t,s)=>{const o=g.createShader(t);g.shaderSource(o,s);g.compileShader(o);if(!g.getShaderParameter(o,g.COMPILE_STATUS))throw Error(g.getShaderInfoLog(o));return o};
  const p=g.createProgram();g.attachShader(p,sh(g.VERTEX_SHADER,VS));g.attachShader(p,sh(g.FRAGMENT_SHADER,FS));g.linkProgram(p);
  if(!g.getProgramParameter(p,g.LINK_STATUS))throw Error('link');
  g.useProgram(p);for(const k of['uC','uU','uT','uI','uW','uF','uOil'])UN[k]=g.getUniformLocation(p,k);
  UN.roots=g.getUniformLocation(p,'uRoots[0]');gl=g;
 }
}catch(e){gl=null}
if(!gl)c1.style.display='none';
c1.addEventListener('webglcontextlost',e=>{e.preventDefault();gl=null;c1.style.display='none'});

/* ---------- forest plate and directional firelight ---------- */
const pitPhoto = new Image();
let litPit = null;
const pitAnchor = { x: .50, y: .778 };
const frontRim = [
 [.22,.78],[.265,.79],[.295,.81],[.325,.83],[.365,.842],
 [.425,.846],[.474,.865],[.545,.859],[.579,.841],[.62,.808],
 [.665,.798],[.696,.771],[.739,.736],[.775,.742]
];
function makeLitPit(image){
 const width=image.naturalWidth,height=image.naturalHeight;
 const plate=mk(width,height),ctx=plate.getContext('2d');
 ctx.drawImage(image,0,0);
 const pixels=ctx.getImageData(0,0,width,height),data=pixels.data;
 const horizontal=Array.from({length:width},(_,x)=>{
  const offset=(x/width-pitAnchor.x)/.28;
  return Math.exp(-(offset*offset));
 });
 for(let y=0;y<height;y++){
  const offset=(y/height-pitAnchor.y)/.24;
  const vertical=Math.exp(-(offset*offset))*Math.min(1,Math.max(0,(y/height-.40)*4.4));
  for(let x=0;x<width;x++){
   const i=(y*width+x)*4,light=horizontal[x]*vertical;
   const luminance=.21*data[i]+.72*data[i+1]+.07*data[i+2];
   const reflected=(5+1.39*luminance)*light;
   data[i]=data[i]*(1+.85*light)+reflected*.96;
   data[i+1]=data[i+1]*(1+.30*light)+reflected*.55;
   data[i+2]=data[i+2]*(1-.10*light)+reflected*.24;
  }
 }
 ctx.putImageData(pixels,0,0);
 return plate;
}
function pitFrame(){
 const width=pitPhoto.naturalWidth,height=pitPhoto.naturalHeight;
 // On portrait screens keep the whole stone ring in the frame.
 const scale=Math.min(Math.max(W/width,H/height),W/(width*.65));
 return {x:cx-width*scale*pitAnchor.x,y:by-height*scale*pitAnchor.y,w:width*scale,h:height*scale};
}
function paintPit(lit){
 const plate=mk(W*D,H*D),ctx=plate.getContext('2d');
 ctx.scale(D,D);
 ctx.fillStyle='#080b0d';
 ctx.fillRect(0,0,W,H);
 const {x,y,w,h}=pitFrame();
 ctx.drawImage(lit?litPit:pitPhoto,x,y,w,h);
 if(y>0){
  const fade=ctx.createLinearGradient(0,y,0,y+h*.27);
  fade.addColorStop(0,'#080b0d');fade.addColorStop(1,'rgba(8,11,13,0)');
  ctx.fillStyle=fade;ctx.fillRect(x,y,w,h*.27);
 }
 if(y+h<H){
  const fade=ctx.createLinearGradient(0,y+h*.955,0,y+h);
  fade.addColorStop(0,'rgba(8,11,13,0)');fade.addColorStop(1,'#080b0d');
  ctx.fillStyle=fade;ctx.fillRect(x,y+h*.955,w,h*.045);
 }
 return plate;
}
function drawOilLight(c,flash=0){
 if(flash<.01)return;
 c.save();c.globalCompositeOperation='screen';c.globalAlpha=.59*flash;
 c.drawImage(bWarm,cx+(oilX-1.42)*U,by-U*.51,U*2.84,U*.97);
 c.restore();
}
function drawForegroundStones(light,oilFlash){
 if(!litPit)return;
 const {x,y,w,h}=pitFrame();
 x2.save();
 x2.beginPath();
 frontRim.forEach(([u,v],index)=>index===0?x2.moveTo(x+u*w,y+v*h):x2.lineTo(x+u*w,y+v*h));
 x2.lineTo(x+.775*w,y+h);x2.lineTo(x+.22*w,y+h);x2.closePath();
 x2.clip();
 x2.globalAlpha=1;
 x2.drawImage(bgD,0,0,W,H);
 x2.globalAlpha=light;
 x2.drawImage(bgL,0,0,W,H);
 drawOilLight(x2,oilFlash);
 x2.restore();
}
function drawEmberBed(){
 if(em<.01)return;
 for(const ember of EM){
  const pulse=.5+.5*Math.sin(T*ember.pulse+ember.phase);
  const heat=em*(.22+.78*pulse**3);
  const size=ember.size*U;
  x0.save();
  x0.translate(cx+ember.x*U,by+ember.y*U);
  x0.scale(size,size*.53);
  x0.fillStyle=`rgb(${27+72*heat|0},${21+24*heat|0},${18+8*heat|0})`;
  x0.fill(ember.shape);
  x0.strokeStyle=`rgba(${155+100*heat|0},${26+112*heat|0},${10+32*heat|0},${.9*heat})`;
  x0.lineWidth=.22;
  x0.lineCap='round';
  x0.stroke(ember.crack);
  x0.restore();
 }
 x0.globalCompositeOperation='lighter';
 x0.globalAlpha=.22*em;
 x0.drawImage(bWarm,cx-U*.65,by-U*.18,U*1.3,U*.36);
 x0.globalAlpha=1;
 x0.globalCompositeOperation='source-over';
}
pitPhoto.onload=()=>{
 try{litPit=makeLitPit(pitPhoto)}catch{ return }
 bgD=paint(0);bgL=paint(1);
 if(paused&&!document.hidden)render(0);
};
pitPhoto.src='./forest-pit.webp';

/* ---------- procedural background if the forest plate cannot load ---------- */
function pine(c,x,b,h,w){c.beginPath();c.moveTo(x,b-h);const n=6;
 for(let i=1;i<=n;i++){const y=b-h+h*i/n,ww=w*i/n;c.lineTo(x+ww,y);c.lineTo(x+ww*.5,y)}
 for(let i=n;i>=1;i--){const y=b-h+h*i/n,ww=w*i/n;c.lineTo(x-ww*.5,y);c.lineTo(x-ww,y)}
 c.fill()}
function paint(lit){
 if(litPit)return paintPit(lit);
 const cv=mk(W*D,H*D),c=cv.getContext('2d'),r=rng(11),hz=H*.6;c.scale(D,D);
 let g=c.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#02040b');g.addColorStop(.72,'#080e1a');g.addColorStop(1,lit?'#1a1720':'#111a29');c.fillStyle=g;c.fillRect(0,0,W,hz+2);
 for(let i=0;i<170;i++){const x=r()*W,y=r()*r()*hz,s=.5+r()*1.2,a=.2+r()*.7;c.fillStyle=`rgba(${200+r()*55|0},${210+r()*40|0},255,${lit?a*.7:a})`;c.fillRect(x,y,s,s)}
 c.fillStyle=lit?'#14121b':'#0c1320';
 const distant=rng(19);
 for(let i=0;i<65;i++){const x=(i+distant()*.95-1)*W/63,h=H*(.05+distant()*.105);pine(c,x,hz,h,h*(.16+distant()*.1))}
 c.fillStyle=lit?'#0a0c13':'#060a13';
 let n=Math.ceil(W/38)+2;
 for(let i=0;i<n;i++){const x=(i+r()*.8-.4)/(n-1)*W,h=H*.17*(.6+r()*.7);pine(c,x,hz+H*.01,h,h*.24)}
 c.fillRect(0,hz-H*.015,W,H*.03);
 g=c.createLinearGradient(0,hz,0,H);g.addColorStop(0,lit?'#171419':'#0a0d13');g.addColorStop(1,lit?'#080707':'#030409');c.fillStyle=g;c.fillRect(0,hz,W,H-hz);

function makeLogPhotos(atlas){
 // Each row holds the same silhouette in raw and charred states.
 return [[20,177,718,200],[17,679,728,194]].map(([x,y,w,h])=>{
  const [bark,charcoal]=[0,769].map(offset=>{
   const tile=mk(w,h),c=tile.getContext('2d');
   c.drawImage(atlas,x+offset,y,w,h,0,0,w,h);
   c.globalCompositeOperation='source-atop';
   const shade=c.createLinearGradient(0,0,0,h);
   shade.addColorStop(0,'rgba(10,9,12,.06)');
   shade.addColorStop(1,'rgba(8,7,10,.38)');
   c.fillStyle=shade;c.fillRect(0,0,w,h);
   return tile;
  });

  const ember=mk(w,h),e=ember.getContext('2d');
  const reflection=mk(w,h),r=reflection.getContext('2d');
  const carbon=charcoal.getContext('2d').getImageData(0,0,w,h).data;
  const hot=e.createImageData(w,h),step=4,vertical=w*step*4,horizontal=step*4;
  const warm=r.createImageData(w,h);
  for(let row=0;row<h;row++){
   for(let col=0;col<w;col++){
    const p=(row*w+col)*4;
    // The existing ridges catch firelight while the fissures stay dark.
    const facing=Math.max(0,1-((col/w-.52)/.59)**2-((row/h-.19)/.69)**2);
    const grain=Math.min(1,carbon[p+1]/103);
    warm.data[p]=255;
    warm.data[p+1]=111+58*grain;
    warm.data[p+2]=38+33*grain;
    warm.data[p+3]=carbon[p+3]*facing*(.045+.79*grain);
   }
  }
  r.putImageData(warm,0,0);

  for(let row=step;row<h-step;row++){
   for(let col=step;col<w*.91;col++){
    const p=(row*w+col)*4,gray=carbon[p+1];
    if(carbon[p+3]<240||gray>48)continue;
    // Emit between brighter bark ridges, well inside the outer edge.
    const rim=Math.max(
     Math.min(carbon[p-vertical+1],carbon[p+vertical+1]),
     Math.min(carbon[p-horizontal+1],carbon[p+horizontal+1])
    );
    const seam=Math.min(1,(rim-gray-10)/31);
    if(seam<=0)continue;
    const pocket=Math.max(0,1-((col/w-.47)/.45)**2-((row/h-.59)/.33)**2);
    hot.data[p]=255;
    hot.data[p+1]=68+99*seam;
    hot.data[p+2]=16+30*seam;
    hot.data[p+3]=230*pocket*seam*(1-gray/56);
   }
  }
  e.putImageData(hot,0,0);
  return [bark,charcoal,ember,reflection];

}

  const strength=fireRoots[i+2],offset=anchor*.60-fireRoots[i];

function updateFireRoots(){

  if(!log.land||log.heat<=.16)continue;

 function noise(x,y){
  const a=Math.floor(x),b=Math.floor(y),u=smooth(x-a),v=smooth(y-b);
  return lerp(lerp(sample(a,b),sample(a+1,b),u),lerp(sample(a,b+1),sample(a+1,b+1),u),v);
 }
 const count=24,w=52,h=72;
 return Array.from({length:count},(_,frame)=>{
  const tile=mk(w,h),ctx=tile.getContext('2d'),img=ctx.createImageData(w,h);
  const t=frame/count,phase=t*2*Math.PI;
  for(let row=0;row<h;row++){
   const y=1.04-(row+.5)*1.17/h,rise=Math.max(0,y);
   const curl=.19*Math.sin(Math.PI*rise)+rise*(.24*Math.sin(rise*5.5-phase)+.19*Math.sin(rise*9-2*phase));
   const width=.58-.47*smooth(rise);
   for(let col=0;col<w;col++){
    const x=((col+.5)/w*1.56-.78-curl)/width;
    const folds=noise(x*1.8+2,rise*5-t*16);
    const ripple=noise(x*3.1-2,rise*8-t*32);
    const edge=1-smooth((Math.abs(x)+(folds-.48)*.55-.53)/.52);
    const tip=1-smooth((y-.60-.22*folds)/.32);
    const density=edge*tip*smooth((y+.12)/.25)*(.24+.76*smooth((folds+.16*ripple-.20-.12*rise)/.47));
    const crease=(x+(folds-.5)*1.5)*1.8;
    const filament=Math.exp(-crease*crease);
    const hot=clamp((.48+.32*smooth((rise-.06)/.27))*filament+.44*folds-.43*rise);
    const p=(row*w+col)*4;
    img.data[p]=lerp(211,255,hot);
    img.data[p+1]=lerp(76,234,hot);
    img.data[p+2]=lerp(16,162,hot**1.45);
    img.data[p+3]=242*density;
   }
  }
  ctx.putImageData(img,0,0);
  return tile;
 });
})();
function drawLogFlame(c,{x,y,width,height,lean,side,opacity,phase}){
 if(opacity<=.01)return;
 const frame=Math.floor(T*(14+phase%4)+phase*7)%surfaceFlameFrames.length;
 c.save();c.translate(x,y);c.transform(width*side,0,-lean,height,0,0);
 c.globalAlpha=opacity;
 c.drawImage(surfaceFlameFrames[frame],-.78,-1.04,1.56,1.17);
 c.restore();
}
function fallback(dt,wind,fi,oilFlash){
 fAcc=Math.min(5,fAcc+dt*(reduced?27:65)*fi);
 while(fAcc>1&&FP.length<210){
  fAcc--;
  const root=pickFireRoot();
  if(root<0)break;
  const sm=R()<.07,heat=fireRoots[root+2],origin=cx+fireRoots[root]*U;
  FP.push({
   x:origin+(R()-.5)*U*(.08+.21*heat),y:by-U*(fireRoots[root+1]+(sm?.12:0)),
   vy:-U*(sm?.29:(.34+R()*.49)*(.63+.34*fi)),l:0,m:sm?3.4:.46+R()*.52,
   s:U*(sm?.16:.10+R()*.09)*(.68+.32*heat),sm,ph:R()*9,side:R()<.5?-1:1,origin
  });
 }
 for(let i=FP.length;i--;){const p=FP[i];p.l+=dt;if(p.l>=p.m){FP.splice(i,1);continue}
  const k=p.l/p.m;p.y+=p.vy*dt;p.x+=((p.sm?0:(p.origin-p.x)*.58)+wind*U*(p.sm?.36:.44*k)+Math.sin(T*5+p.ph)*U*.07)*dt;
  if(p.sm){
   const s=p.s*(1+k*2);
   x2.globalCompositeOperation='source-over';x2.globalAlpha=.25*Math.sin(k*Math.PI);
   x2.drawImage(bSmoke,p.x-s,p.y-s,s*2,s*2);
   continue;
  }
  const width=p.s*(1.9-k*1.3),height=p.s*(2.2+.4*Math.sin(k*Math.PI));
  x2.save();x2.translate(p.x,p.y);x2.rotate(k*(wind*.28+.22*Math.sin(T*4+p.ph)));x2.scale(p.side,1);
  x2.globalCompositeOperation='screen';x2.globalAlpha=Math.sin(Math.PI*k)*(.65+.18*Math.sin(T*7+p.ph));
  x2.drawImage(flameBrush,-width*.47,-height,width,height);
  x2.restore();
 }
 if(oilFlash>.01){
  const width=U*(.22+.46*oilFlash),height=U*(.42+.98*oilFlash);
  const sway=.15*Math.sin(T*12)+wind*.25;
  x2.save();x2.translate(cx+oilX*U,by-oilY*U);x2.transform(1,0,-sway,1,0,0);
  x2.globalCompositeOperation='screen';x2.globalAlpha=.90*oilFlash;
  x2.drawImage(flameBrush,-width*.44,-height,width,height);
  x2.scale(-1,1);x2.globalAlpha=.64*oilFlash;
  x2.drawImage(flameBrush,-width*.29,-height*.71,width*.67,height*.75);
  x2.restore();
 }
 x2.globalAlpha=1;x2.globalCompositeOperation='source-over';
}

/* ---------- opt-in synthesized sound ---------- */
let AC=null,master,nb,bedGain,bedFilter,snd=false;
let nextBedUpdate=0,nextCrackle=0;
let bedLevel=0,bedCutoff=110;
function initAudio(){try{
 AC=new(window.AudioContext||window.webkitAudioContext)();
 nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;
 master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
 const source=AC.createBufferSource();source.buffer=nb;source.loop=true;
 bedLevel=0;bedCutoff=110;
 bedFilter=AC.createBiquadFilter();bedFilter.type='lowpass';bedFilter.frequency.value=bedCutoff;
 bedGain=AC.createGain();bedGain.gain.value=bedLevel;
 source.connect(bedFilter);bedFilter.connect(bedGain);bedGain.connect(master);source.start();
 nextBedUpdate=nextCrackle=0;
 return true}catch(e){AC=null;return false}}

function canPlaySound(){
 return snd&&AC?.state==='running'&&!paused&&!document.hidden;
}

function syncAudio(){
 if(!AC)return;
 const visible=!paused&&!document.hidden;
 const volume=visible&&snd ? .5 : 0;
 const now=AC.currentTime;
 master.gain.cancelScheduledValues(now);
 master.gain.setTargetAtTime(volume,now,volume>0 ? .14 : .035);
 if(!visible)AC.suspend().catch(()=>{});
 else if(snd)AC.resume().catch(()=>{});
}

function soundEnvelope(gain,when,level,attack,duration){
 gain.setValueAtTime(.0001,when);
 gain.exponentialRampToValueAtTime(level,when+attack);
 gain.exponentialRampToValueAtTime(.0001,when+duration);
}

function noiseSweep(when,{from,to,peak=to,level,attack,duration,q=.8}){
 const source=AC.createBufferSource(),filter=AC.createBiquadFilter(),gain=AC.createGain();
 source.buffer=nb;
 filter.type='bandpass';
 filter.Q.value=q;
 filter.frequency.setValueAtTime(from,when);
 filter.frequency.exponentialRampToValueAtTime(peak,when+attack);
 filter.frequency.exponentialRampToValueAtTime(to,when+duration);
 soundEnvelope(gain.gain,when,level,attack,duration);
 source.connect(filter);filter.connect(gain);gain.connect(master);
 source.onended=()=>{source.disconnect();filter.disconnect();gain.disconnect()};
 source.start(when,R()*(nb.duration-duration),duration);
}

function fireCrackle(when,flame,embers,flick,weight=1){
 const frequency=(640+flame*2600)*(.58+.84*R());
 const level=(.088*embers+.44*flame**1.2)*(.38+.62*R()**2)*(.72+.28*flick)*weight;
 noiseSweep(when,{
  from:frequency,peak:frequency*1.12,to:frequency*(.46+.16*flame),level,
  attack:.002+R()*.002,duration:.022+.022*(1-flame)+R()*.023,q:1.5
 });
}

function updateFireAudio(dt,intensity,flick,emberHeat){
 if(!dt||!canPlaySound())return;
 const flame=Math.max(0,Math.min(1,(intensity-.025)/1.2));
 const embers=Math.max(0,Math.min(1,(emberHeat-.025)/.43));
 const now=AC.currentTime;
 if(now>=nextBedUpdate){
  const level=(.07*embers+.86*flame**1.35)*(.74+.26*flick);
  const cutoff=110+flame*(310+70*flick);
  if(Math.abs(level-bedLevel)>.012||(level===0&&bedLevel>0)){
   bedGain.gain.setTargetAtTime(level,now,.15);
   bedLevel=level;
  }
  if(Math.abs(cutoff-bedCutoff)>8){
   bedFilter.frequency.setTargetAtTime(cutoff,now,.17);
   bedCutoff=cutoff;
  }
  nextBedUpdate=now+.125;
 }
 const rate=.78*embers+12*flame**1.5*(.46+.9*flick);
 if(now<nextCrackle||R()>=-Math.expm1(-rate*dt))return;
 fireCrackle(now,flame,embers,flick);
 // Hotter surges occasionally give a quieter second snap.
 if(flame>.43&&R()<flame*flick*.58){
  const delay=.022+R()*.044;
  fireCrackle(now+delay,flame,embers,flick,.53);
  nextCrackle=now+delay+.036;
 }else nextCrackle=now+.04;
}

function woodTone(when,frequency,level,duration){
 const tone=AC.createOscillator(),gain=AC.createGain();
 tone.frequency.setValueAtTime(frequency,when);
 tone.frequency.exponentialRampToValueAtTime(frequency*.8,when+duration);
 soundEnvelope(gain.gain,when,level,.004,duration);
 tone.connect(gain);gain.connect(master);
 tone.onended=()=>{tone.disconnect();gain.disconnect()};
 tone.start(when);tone.stop(when+duration);
}

function woodImpact(speed){
 if(!canPlaySound())return;
 const when=AC.currentTime,weight=Math.min(1,Math.max(.36,speed/4));
 const pitch=100+R()*37;
 woodTone(when,pitch,.22*weight,.17);
 woodTone(when,pitch*2.42,.09*weight,.095);
 noiseSweep(when,{from:1100,to:560,level:.21*weight,attack:.004,duration:.073,q:1.3});
 noiseSweep(when+.055,{from:2600,to:1350,level:.14*weight,attack:.002,duration:.049,q:1.5});
}

function oilTrickle(){
 if(!canPlaySound())return;
 const when=AC.currentTime;
 noiseSweep(when,{from:1750,peak:2480,to:980,level:.21,attack:.046,duration:.27,q:1.25});
 for(const delay of [.041,.105,.173]){
  noiseSweep(when+delay,{from:1400,to:630,level:.16,attack:.004,duration:.055,q:2.4});
 }
}

function oilFlare(){
 if(!canPlaySound())return;
 const level=reduced ? .78 : 1;
 const when=AC.currentTime;
 noiseSweep(when,{from:240,peak:780,to:345,level:.42*level,attack:.068,duration:.67,q:.7});
 noiseSweep(when+.018,{from:790,peak:1410,to:490,level:.19*level,attack:.08,duration:.49,q:.6});
}

/* ---------- simulation + render ---------- */
function render(dt){
 T+=dt*(reduced?.45:1);
 const wind=S.wind+Math.sin(T*.31)*.08+Math.sin(T*.13+2)*.06;
 let heat=0,fuel=0;
 for(let i=logs.length;i--;){const l=logs[i];l.age+=dt;
  let impactSpeed=l.land?2.4:null;
  if(!l.land){l.vy+=7*dt;l.oy-=l.vy*dt;
   if(l.oy<=0){
    l.oy=0;impactSpeed=l.vy;
    if(l.vy>1.6){l.vy*=-.28;if(I>.12)for(let j=0;j<4;j++)fireSpark(.7)}
    else l.land=1;
   }}
  else{l.heat=Math.min(1,l.heat+dt*(.012+.03*I+.08*boost));l.char=Math.min(1,l.char+dt*l.heat*.035);l.fuel-=dt*l.heat*l.burn}
  if(dt>0&&l.impactPending&&impactSpeed!==null){
   l.impactPending=false;
   woodImpact(impactSpeed);
  }
  if(l.fuel<=0){logs.splice(i,1);continue}
  if(l.land)heat+=l.heat*Math.min(1,l.fuel*4);
  fuel+=l.fuel}
 updateFireRoots();
 I+=(Math.min(1.1,heat/3)-I)*dt*.6;
 oilFlashAge+=dt;
 if(pourAge!==null){
  const previous=pourAge;
  pourAge+=dt;
  if(previous===0&&dt>0)oilTrickle();
  if(previous<.29&&pourAge>=.29){
   bGoal=Math.max(bGoal,reduced?.35:1.18);
   oilFlashAge=pourAge-.29;oilX=pourX;oilY=pourY;
   oilFlare();
   say('炎が燃え上がりました');
   for(let i=0;i<(reduced?4:26);i++)spark(cx+(oilX+(R()-.5)*.27)*U,by-(oilY+R()*.12)*U,.89+R()*.69);
  }
  if(pourAge>.62)pourAge=null;
 }
 bGoal*=Math.exp(-dt/1.8);boost+=(bGoal-boost)*Math.min(1,dt*2.5);
 feedT+=dt;if(S.auto&&feedT>7&&(logs.length<4||fuel<2.2))addLog();
 const fi=I+boost*.45,flick=.5+.25*Math.sin(T*9.1)+.15*Math.sin(T*14.7+1)+.1*Math.sin(T*23.3);
 const oilFlash=(reduced?.48:1)*Math.min(1,oilFlashAge/.13)*Math.exp(-Math.max(0,oilFlashAge-.13)/.69);
 const ambientLight=(1-Math.exp(-Math.max(0,fi)*2.53))*(reduced?.96+.04*flick:.88+.12*flick);
 const light=ambientLight+(1-ambientLight)*.91*oilFlash;
 em+=(Math.min(1,I+boost*.3)-em)*dt*.3;

 x0.globalAlpha=1;x0.drawImage(bgD,0,0,W,H);x0.globalAlpha=light;x0.drawImage(bgL,0,0,W,H);x0.globalAlpha=1;
 drawEmberBed();
 drawOilLight(x0,oilFlash);
 for(const l of logs)if(!l.front)drawLog(x0,l,light);

 if(gl){
  gl.uniform2f(UN.uC,cx*gs,(H-by)*gs);gl.uniform1f(UN.uU,U*gs);gl.uniform1f(UN.uT,T);
  gl.uniform1f(UN.uI,fi);gl.uniform1f(UN.uW,wind);gl.uniform1f(UN.uF,flick);
  gl.uniform3fv(UN.roots,fireRoots);
  gl.uniform3f(UN.uOil,oilX,oilY,oilFlash);
  gl.drawArrays(gl.TRIANGLES,0,3);
 }

 x2.clearRect(0,0,W,H);
 if(!gl)fallback(dt,wind,fi,oilFlash);
 // The closest log hides both the bark and small flames behind it.
 for(let i=logs.length-1;i>=0;i--)if(logs[i].front)drawLog(x2,logs[i],light,wind);
 drawForegroundStones(light,oilFlash);
 spAcc=Math.min(8,spAcc+(12*I+45*boost)*(reduced?.4:1)*dt);
 while(spAcc>1){spAcc--;fireSpark(1+boost*.4)}
 x2.globalCompositeOperation='lighter';x2.lineCap='round';
 for(let i=SP.length;i--;){const p=SP[i];p.l-=dt;if(p.l<=0||p.y<-20){SP.splice(i,1);continue}
  p.px=p.x;p.py=p.y;p.vx+=((wind*U*.9-p.vx)*.7+Math.sin(T*3+p.ph)*U*.5)*dt;p.vy+=(-U*.12-p.vy*.35)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  const k=p.l/p.m;x2.strokeStyle=`rgba(255,${90+150*k|0},${30+90*k*k|0},${Math.min(1,k*2.5)})`;x2.lineWidth=p.s*(.5+.5*k)*(U/300+.5);
  x2.beginPath();x2.moveTo(p.px,p.py);x2.lineTo(p.x,p.y+.01);x2.stroke()}
 x2.globalCompositeOperation='source-over';
 drawPour();

 updateFireAudio(dt,fi,flick,em);
 statT-=dt;if(statT<=0){statT=.5;$('stat').textContent=`薪 ${logs.length}/${MAXL}本 ・ 残りの燃料 ${fuel.toFixed(1)}本分`}
}
function tick(now){
 raf=requestAnimationFrame(tick);
 if(now-last<32)return;
 const dt=Math.min(.1,(now-last)/1000);last=now;render(dt);
}
function start(){if(!raf&&!paused&&!document.hidden){last=performance.now();raf=requestAnimationFrame(tick)}}
function stop(){cancelAnimationFrame(raf);raf=0}
function resize(){
 W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);D=Math.min(devicePixelRatio||1,2,Math.max(1,2400/Math.max(W,H)));
 U=Math.min(W,H*.8)*.42;cx=W/2;by=H*.8;
 for(const c of[c0,c2]){c.width=W*D;c.height=H*D}
 x0.setTransform(D,0,0,D,0,0);x2.setTransform(D,0,0,D,0,0);
 gs=Math.min(1,1100/Math.max(W,H));c1.width=W*gs;c1.height=H*gs;if(gl)gl.viewport(0,0,c1.width,c1.height);
 bgD=paint(0);bgL=paint(1);logs.forEach(l=>l.spr=null);statT=0;
 if(!raf)render(0)}

/* ---------- UI ---------- */
let msgT,idleT,rsT,drag=null;
const say=m=>{$('msg').textContent=m;clearTimeout(msgT);msgT=setTimeout(()=>$('msg').textContent='',4000)};
const wake=()=>{document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),5000)};
const settings=$('panel'),openSettings=$('show-settings'),closeSettings=$('hide-settings');
function setSettingsOpen(open){
 settings.hidden=!open;
 $('intro').hidden=!open;
 openSettings.hidden=open;
 openSettings.setAttribute('aria-expanded',String(open));
 wake();
 (open?closeSettings:openSettings).focus({preventScroll:true});
}
openSettings.onclick=()=>setSettingsOpen(true);
closeSettings.onclick=()=>setSettingsOpen(false);
['pointermove','pointerdown','keydown','focusin','touchstart','wheel'].forEach(e=>addEventListener(e,wake,{passive:true}));
const feed=()=>{say(addLog()?'薪をくべました':`薪はいっぱいです(最大${MAXL}本)`);statT=0;if(!raf)render(0)};
const flare=()=>{bGoal=Math.min(1,bGoal+(reduced?.3:.7));say('炎をあおりました')};
const pour=()=>{
 if(pourAge!==null)return;
 const root=pickFireRoot();
 if(root<0){say('火種が消えています');return}
 pourX=fireRoots[root];pourY=fireRoots[root+1];
 pourAge=0;
 say(paused?'油をかける演出は再開すると始まります':'油をかけました');
};
const togglePause=()=>{paused=!paused;$('pause').setAttribute('aria-pressed',paused);$('pause').textContent=paused?'再開':'一時停止';
 if(paused)stop();else start();syncAudio()};
const de=document.documentElement,rq=de.requestFullscreen||de.webkitRequestFullscreen,ex=document.exitFullscreen||document.webkitExitFullscreen;
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const fsUpd=()=>{if(rq)$('fs').textContent=fsEl()?'全画面を終了':'全画面'};
const toggleFs=()=>{if(!rq)return;try{const p=fsEl()?ex.call(document):rq.call(de);if(p&&p.catch)p.catch(()=>say('全画面にできませんでした'))}catch(e){say('全画面にできませんでした')}};
if(!rq){$('fs').disabled=true;$('fs').textContent='全画面は非対応'}
['fullscreenchange','webkitfullscreenchange'].forEach(e=>document.addEventListener(e,fsUpd));
$('feed').onclick=feed;$('flare').onclick=flare;$('pause').onclick=togglePause;$('fs').onclick=toggleFs;
$('oil').onclick=pour;
$('auto').checked=S.auto;$('auto').onchange=e=>{S.auto=e.target.checked;save()};
$('wind').value=Math.round(S.wind*100);$('wind').oninput=e=>{S.wind=e.target.value/100;save()};
$('snd').onclick=()=>{snd=!snd;if(snd&&!AC&&!initAudio()){snd=false;say('この環境では音声を利用できません')}
 syncAudio();
 $('snd').setAttribute('aria-pressed',snd);$('snd').textContent=snd?'音: オン':'音: オフ'};
c2.addEventListener('pointerdown',e=>{drag={x:e.clientX,w:S.wind};try{c2.setPointerCapture(e.pointerId)}catch(_){}});
c2.addEventListener('pointermove',e=>{if(!drag)return;S.wind=Math.max(-1,Math.min(1,drag.w+(e.clientX-drag.x)/W*2.5));$('wind').value=Math.round(S.wind*100)});
const endDrag=()=>{if(drag){drag=null;save()}};c2.addEventListener('pointerup',endDrag);c2.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
 const k=e.key.toLowerCase();
 if(k==='escape'&&!fsEl()){setSettingsOpen(settings.hidden);return}
 if(e.target.matches&&e.target.matches('input'))return;
 if(k==='h')setSettingsOpen(settings.hidden);else if(k==='l')feed();else if(k==='a')flare();else if(k==='p')togglePause();else if(k==='f')toggleFs();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else start();syncAudio()});
addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(resize,120)});
if(paused){$('pause').setAttribute('aria-pressed','true');$('pause').textContent='再開'}
resize();wake();start();
})();
</script>
