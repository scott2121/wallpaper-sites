<h1>焚き火 <span lang="en">Campfire</span></h1>
<p class="sum">夜の森で静かに燃える焚き火。薪は燃えながら小さくなり、熾火になります。油をかける演出では火が一時的に強まります。画面を左右にドラッグすると風向きが変わります。</p>

<script>
(()=>{
const $=id=>document.getElementById(id),KEY='wallpaper-sites:campfire',MAXL=7,R=Math.random;
const RM=matchMedia('(prefers-reduced-motion: reduce)');let reduced=RM.matches;
RM.addEventListener&&RM.addEventListener('change',e=>reduced=e.matches);
const c0=$('c0'),c1=$('c1'),c2=$('c2'),x0=c0.getContext('2d'),x2=c2.getContext('2d');
if(!x0||!x2){$('msg').textContent='このブラウザでは焚き火を描画できません。';return}
const S={auto:true,wind:0};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
S.auto=S.auto!==false;S.wind=Math.max(-1,Math.min(1,+S.wind||0));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c};
const blob=(a,b)=>{const c=mk(64,64),x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,a);g.addColorStop(.4,b);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return c};
const bHot=blob('rgba(255,235,170,.9)','rgba(255,150,40,.45)'),bWarm=blob('rgba(255,120,30,.7)','rgba(200,40,5,.3)'),bSmoke=blob('rgba(90,88,92,.5)','rgba(60,60,66,.25)');

let W,H,D,U,cx,by,gs,bgD,bgL,T=0,I=.8,em=.8,boost=0,bGoal=0,feedT=0,raf=0,last=0,paused=reduced,statT=0,spAcc=0,fAcc=0,pourAge=null;
const logs=[],SP=[],FP=[],EM=[];
// Each lane stores the position and strength of the hot wood beneath it.
const fireRoots=new Float32Array(9);
const fireLaneWidth=.30;
let pourX=0,pourY=.15;
/* slots: x, y(up), angle, length, front — units of U around the fire base */
const SL=[[-.06,.065,.06,1.05,1],[.17,.135,-.25,.8,1],[-.26,.25,-.85,.8,0],[.27,.25,.85,.8,0],[.05,.2,.28,.85,1],[-.1,.31,-.5,.7,0],[.12,.34,.55,.7,0]];
{const r=rng(5);for(let i=0;i<90;i++){const a=r()*6.283,d=Math.sqrt(r());EM.push({x:Math.cos(a)*d*.6,y:Math.sin(a)*d*.13,s:.018+r()*.03,ph:r()*9,sp:.4+r()*1.6,v:[0,0,0,0,0,0].map(()=>.6+r()*.5)})}EM.sort((a,b)=>a.y-b.y)}

/* ---------- WebGL2 flames + smoke ---------- */
const VS=`#version 300 es
void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0.,1.);}`;
const FS=`#version 300 es
precision highp float;
uniform vec2 uC;uniform float uU,uT,uI,uW,uF;
uniform vec3 uRoots[3];
out vec4 o;
float h(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*n(p);p=p*2.03+vec2(17.1,9.3);a*=.5;}return s;}
float fl(vec2 p,float sd,float hh,float wd,float sp){
 float y=p.y/hh,t=uT*sp;
 if(y<-.12||y>1.24)return 0.;
 float lift=max(y,0.);
 p.x-=(uW*.26*lift*lift+.12*sin(y*6.1-t*1.8+sd)*lift)*hh;
 if(abs(p.x)>wd+.27)return 0.;
 vec2 w=vec2(fbm(vec2(p.x*2.+sd,p.y*1.5-t*1.2)),n(vec2(p.x*3.-sd,p.y*2.-t*1.5+7.)))-.47;
 vec2 q=p+w*(.12+.64*max(y,0.))*vec2(1.,.6);
 float a=fbm(vec2(q.x*3.6+sd*2.,q.y*1.9-t*2.4));
 float b=n(vec2(q.x*12.-sd+a*1.9,q.y*6.-t*5.2));
 float wid=wd*(1.-.75*smoothstep(0.,1.12,y));
 float d=(1.-abs(q.x)/wid)*.76+(a-.47)*1.66+(b-.47)*.37-y*1.15+.29;
 return d*smoothstep(-.06,.05,p.y)*(1.-smoothstep(.86,1.22,y));
}
vec3 ramp(float d){
 d=max(d,0.);
 // deep red-amber body -> amber -> pale incandescent core
 vec3 c=mix(vec3(.55,.05,0.),vec3(.95,.3,.02),smoothstep(0.,.3,d));
 c=mix(c,vec3(1.,.58,.12),smoothstep(.22,.7,d));
 c=mix(c,vec3(1.,.9,.72),smoothstep(.6,1.25,d));
 // desaturate the hottest region toward warm white
 c=mix(c,vec3(1.,.96,.88)*dot(c,vec3(.3,.59,.11)),.4*smoothstep(.7,1.3,d));
 return c*smoothstep(0.,.18,d);
}
vec3 flameAt(vec2 p,vec3 root,float salt,float scale,float turbulence){
 float heat=root.z;
 if(heat<.01)return vec3(0.);
 float flare=smoothstep(.75,1.47,uI);
 float height=(.22+.57*heat+.23*flare)*scale;
 float width=.13+.14*heat;
 float density=fl(p-root.xy,salt,height,width,.92+.022*salt);
 return ramp(density*turbulence)*(.35+.65*heat);
}
void main(){
 vec2 p=(gl_FragCoord.xy-uC)/uU;
 float heat=uRoots[0].z+uRoots[1].z+uRoots[2].z;
 if(heat<.01||p.y<-.15||p.y>2.8||abs(p.x)>1.35+abs(uW)*.26*p.y*p.y){o=vec4(0.);return;}
 vec2 center=(uRoots[0].xy*uRoots[0].z+uRoots[1].xy*uRoots[1].z+uRoots[2].xy*uRoots[2].z)/heat;

 // Wind deflects the rising plume while leaving the base on the wood.
 vec2 s=p-center;
 s.x-=uW*(.21*s.y+.18*s.y*s.y);
 float w=fbm(vec2(s.x*2.2+3.,s.y*2.-uT*.55));

 // Neighboring lanes overlap, but the hottest pieces supply the tallest tongues.
 vec3 c=flameAt(p,uRoots[0],1.3,.87,.75+.54*w)*.79
       +flameAt(p,uRoots[1],5.7,1.04,1.18-.45*w)
       +flameAt(p,uRoots[2],9.1,.78,.79+.37*w)*.86;

 // Compress the flame brightness without washing out warm colors.
 float m=max(c.r,max(c.g,c.b));
 float burn=smoothstep(.025,.62,heat);
 float a=(1.-exp(-m*2.25))*.97*burn;
 vec3 flame=c*(a/max(m,1e-4));

 // smoke: wider threshold and gentler warp for softer breakup
 float sw=.21+.28*max(s.y,0.);
 float sm=fbm(vec2(s.x*1.5,s.y*1.1-uT*.4)+w);
 float sa=smoothstep(.31,.91,sm)*exp(-s.x*s.x/(sw*sw))*smoothstep(.24,.99,s.y)*.25*burn*(1.-smoothstep(1.3,2.6,s.y));
 vec3 sc=mix(vec3(.48,.25,.13)*(.85+.15*uF),vec3(.20,.21,.25),smoothstep(.48,2.,s.y));

 // glow: flickers with uF, shimmers with turbulence, carries its own coverage
 vec2 glow=p-center-vec2(0.,.12);
 float g=exp(-(glow.x*glow.x+glow.y*glow.y*1.8)*3.1)*.17*burn*min(uI,1.3)*(.75+.25*uF)*(.8+.4*w);
 float alpha=a+sa*(1.-a);
 vec3 rgb=flame+sc*sa*(1.-a);
 // Give the glow its own coverage, keeping every layer premultiplied.
 o=vec4(rgb+vec3(.86,.31,.075)*g*(1.-alpha),alpha+g*(1.-alpha));
}`;
let gl=null;const UN={};
try{
 const g=c1.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:false});
 if(g){
  const sh=(t,s)=>{const o=g.createShader(t);g.shaderSource(o,s);g.compileShader(o);if(!g.getShaderParameter(o,g.COMPILE_STATUS))throw Error(g.getShaderInfoLog(o));return o};
  const p=g.createProgram();g.attachShader(p,sh(g.VERTEX_SHADER,VS));g.attachShader(p,sh(g.FRAGMENT_SHADER,FS));g.linkProgram(p);
  if(!g.getProgramParameter(p,g.LINK_STATUS))throw Error('link');
  g.useProgram(p);for(const k of['uC','uU','uT','uI','uW','uF'])UN[k]=g.getUniformLocation(p,k);
  UN.roots=g.getUniformLocation(p,'uRoots[0]');gl=g;
 }
}catch(e){gl=null}
if(!gl)c1.style.display='none';
c1.addEventListener('webglcontextlost',e=>{e.preventDefault();gl=null;c1.style.display='none'});

/* ---------- forest plate and directional firelight ---------- */
const pitPhoto = new Image();
let litPit = null;
const pitAnchor = { x: .50, y: .778 };
const frontRim = [
 [.22,.78],[.265,.79],[.295,.81],[.325,.83],[.365,.842],
 [.425,.846],[.474,.865],[.545,.859],[.579,.841],[.62,.808],
 [.665,.798],[.696,.771],[.739,.736],[.775,.742]
];
function makeLitPit(image){
 const width=image.naturalWidth,height=image.naturalHeight;
 const plate=mk(width,height),ctx=plate.getContext('2d');
 ctx.drawImage(image,0,0);
 const pixels=ctx.getImageData(0,0,width,height),data=pixels.data;
 const horizontal=Array.from({length:width},(_,x)=>{
  const offset=(x/width-pitAnchor.x)/.28;
  return Math.exp(-(offset*offset));
 });
 for(let y=0;y<height;y++){
  const offset=(y/height-pitAnchor.y)/.24;
  const vertical=Math.exp(-(offset*offset))*Math.min(1,Math.max(0,(y/height-.40)*4.4));
  for(let x=0;x<width;x++){
   const i=(y*width+x)*4,light=horizontal[x]*vertical;
   const luminance=.21*data[i]+.72*data[i+1]+.07*data[i+2];
   const reflected=(5+1.27*luminance)*light;
   data[i]=data[i]*(1+.85*light)+reflected*.94;
   data[i+1]=data[i+1]*(1+.27*light)+reflected*.49;
   data[i+2]=data[i+2]*(1-.10*light)+reflected*.21;
  }
 }
 ctx.putImageData(pixels,0,0);
 return plate;
}
function pitFrame(){
 const width=pitPhoto.naturalWidth,height=pitPhoto.naturalHeight;
 // On portrait screens keep the whole stone ring in the frame.
 const scale=Math.min(Math.max(W/width,H/height),W/(width*.65));
 return {x:cx-width*scale*pitAnchor.x,y:by-height*scale*pitAnchor.y,w:width*scale,h:height*scale};
}
function paintPit(lit){
 const plate=mk(W*D,H*D),ctx=plate.getContext('2d');
 ctx.scale(D,D);
 ctx.fillStyle='#080b0d';
 ctx.fillRect(0,0,W,H);
 const {x,y,w,h}=pitFrame();
 ctx.drawImage(lit?litPit:pitPhoto,x,y,w,h);
 if(y>0){
  const fade=ctx.createLinearGradient(0,y,0,y+h*.27);
  fade.addColorStop(0,'#080b0d');fade.addColorStop(1,'rgba(8,11,13,0)');
  ctx.fillStyle=fade;ctx.fillRect(x,y,w,h*.27);
 }
 if(y+h<H){
  const fade=ctx.createLinearGradient(0,y+h*.955,0,y+h);
  fade.addColorStop(0,'rgba(8,11,13,0)');fade.addColorStop(1,'#080b0d');
  ctx.fillStyle=fade;ctx.fillRect(x,y+h*.955,w,h*.045);
 }
 return plate;
}
function drawForegroundStones(light){
 if(!litPit)return;
 const {x,y,w,h}=pitFrame();
 x2.save();
 x2.beginPath();
 frontRim.forEach(([u,v],index)=>index===0?x2.moveTo(x+u*w,y+v*h):x2.lineTo(x+u*w,y+v*h));
 x2.lineTo(x+.775*w,y+h);x2.lineTo(x+.22*w,y+h);x2.closePath();
 x2.clip();
 x2.globalAlpha=1;
 x2.drawImage(bgD,0,0,W,H);
 x2.globalAlpha=light;
 x2.drawImage(bgL,0,0,W,H);
 x2.restore();
}
pitPhoto.onload=()=>{
 try{litPit=makeLitPit(pitPhoto)}catch{ return }
 bgD=paint(0);bgL=paint(1);
 if(paused&&!document.hidden)render(0);
};
pitPhoto.src='./forest-pit.webp';

/* ---------- procedural background if the forest plate cannot load ---------- */
function pine(c,x,b,h,w){c.beginPath();c.moveTo(x,b-h);const n=6;
 for(let i=1;i<=n;i++){const y=b-h+h*i/n,ww=w*i/n;c.lineTo(x+ww,y);c.lineTo(x+ww*.5,y)}
 for(let i=n;i>=1;i--){const y=b-h+h*i/n,ww=w*i/n;c.lineTo(x-ww*.5,y);c.lineTo(x-ww,y)}
 c.fill()}
function paint(lit){
 if(litPit)return paintPit(lit);
 const cv=mk(W*D,H*D),c=cv.getContext('2d'),r=rng(11),hz=H*.6;c.scale(D,D);
 let g=c.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#02040b');g.addColorStop(.72,'#080e1a');g.addColorStop(1,lit?'#1a1720':'#111a29');c.fillStyle=g;c.fillRect(0,0,W,hz+2);
 for(let i=0;i<170;i++){const x=r()*W,y=r()*r()*hz,s=.5+r()*1.2,a=.2+r()*.7;c.fillStyle=`rgba(${200+r()*55|0},${210+r()*40|0},255,${lit?a*.7:a})`;c.fillRect(x,y,s,s)}
 c.fillStyle=lit?'#14121b':'#0c1320';
 const distant=rng(19);
 for(let i=0;i<65;i++){const x=(i+distant()*.95-1)*W/63,h=H*(.05+distant()*.105);pine(c,x,hz,h,h*(.16+distant()*.1))}
 c.fillStyle=lit?'#0a0c13':'#060a13';
 let n=Math.ceil(W/38)+2;
 for(let i=0;i<n;i++){const x=(i+r()*.8-.4)/(n-1)*W,h=H*.17*(.6+r()*.7);pine(c,x,hz+H*.01,h,h*.24)}
 c.fillRect(0,hz-H*.015,W,H*.03);
 g=c.createLinearGradient(0,hz,0,H);g.addColorStop(0,lit?'#171419':'#0a0d13');g.addColorStop(1,lit?'#080707':'#030409');c.fillStyle=g;c.fillRect(0,hz,W,H-hz);
 if(lit){c.save();c.beginPath();c.rect(0,hz,W,H-hz);c.clip();c.translate(cx,by);c.scale(1,.34);
  g=c.createRadialGradient(0,0,U*.14,0,0,U*3.2);g.addColorStop(0,'rgba(255,165,93,.58)');g.addColorStop(.27,'rgba(185,78,31,.24)');g.addColorStop(.68,'rgba(125,45,20,.055)');g.addColorStop(1,'rgba(100,40,10,0)');
  c.fillStyle=g;c.fillRect(-U*3.3,-U*3.3,U*6.6,U*6.6);c.restore()}
 for(let i=0;i<1150;i++){
  const x=r()*W,k=r(),y=hz+k*(H-hz),s=.35+k*3.4*r(),d=r();
  const falloff=lit?Math.max(0,1-Math.hypot(x-cx,(y-by)*2.7)/(U*2.85)):0;
  c.fillStyle='rgba(0,0,0,.33)';c.fillRect(x+s*.24,y+s*.36,s*1.9,s*.62);
  c.fillStyle=d<.58?`rgba(207,142,92,${.035+falloff*.27})`:`rgba(113,126,150,${.038+falloff*.09})`;
  c.fillRect(x,y,s*1.6,s*.46);
  if(d>.94&&falloff>.08){c.fillStyle=`rgba(255,199,136,${falloff*.26})`;c.fillRect(x,y,s*.72,.6)}
 }
 c.lineWidth=1.2;
 for(let i=0;i<150;i++){const x=r()*W,k=Math.pow(r(),1.5),y=hz+H*.02+k*(H-hz),h=3+k*10*r(),dx=(r()-.5)*5;
  const b=lit?Math.max(0,1-Math.hypot(x-cx,(y-by)*2.5)/(U*3)):0;
  c.strokeStyle=`rgba(${14+150*b|0},${18+80*b|0},${22+20*b|0},.7)`;c.beginPath();c.moveTo(x,y);c.lineTo(x+dx,y-h);c.stroke()}
 n=Math.ceil(W/70)+2;const clr=Math.min(U*1.4,W*.3);
 for(let i=0;i<n;i++){const x=(i+r()*.8-.4)/(n-1)*W,h=H*.3*(.6+r()*.7);if(Math.abs(x-cx)<clr)continue;

 while(spAcc>1){spAcc--;fireSpark(1+boost*.4)}
 x2.globalCompositeOperation='lighter';x2.lineCap='round';
 for(let i=SP.length;i--;){const p=SP[i];p.l-=dt;if(p.l<=0||p.y<-20){SP.splice(i,1);continue}
  p.px=p.x;p.py=p.y;p.vx+=((wind*U*.9-p.vx)*.7+Math.sin(T*3+p.ph)*U*.5)*dt;p.vy+=(-U*.12-p.vy*.35)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  const k=p.l/p.m;x2.strokeStyle=`rgba(255,${90+150*k|0},${30+90*k*k|0},${Math.min(1,k*2.5)})`;x2.lineWidth=p.s*(.5+.5*k)*(U/300+.5);
  x2.beginPath();x2.moveTo(p.px,p.py);x2.lineTo(p.x,p.y+.01);x2.stroke()}
 x2.globalCompositeOperation='source-over';
 drawPour();

 if(dt&&canPlaySound()&&R()<dt*(1.5+9*Math.min(1.3,fi)))pop();
 statT-=dt;if(statT<=0){statT=.5;$('stat').textContent=`薪 ${logs.length}/${MAXL}本 ・ 残りの燃料 ${fuel.toFixed(1)}本分`}
}
function tick(now){
 raf=requestAnimationFrame(tick);
 if(now-last<32)return;
 const dt=Math.min(.1,(now-last)/1000);last=now;render(dt);
}
function start(){if(!raf&&!paused&&!document.hidden){last=performance.now();raf=requestAnimationFrame(tick)}}
function stop(){cancelAnimationFrame(raf);raf=0}
function resize(){
 W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);D=Math.min(devicePixelRatio||1,2,Math.max(1,2400/Math.max(W,H)));
 U=Math.min(W,H*.8)*.42;cx=W/2;by=H*.8;
 for(const c of[c0,c2]){c.width=W*D;c.height=H*D}
 x0.setTransform(D,0,0,D,0,0);x2.setTransform(D,0,0,D,0,0);
 gs=Math.min(1,1100/Math.max(W,H));c1.width=W*gs;c1.height=H*gs;if(gl)gl.viewport(0,0,c1.width,c1.height);
 bgD=paint(0);bgL=paint(1);logs.forEach(l=>l.spr=null);statT=0;
 if(!raf)render(0)}

/* ---------- UI ---------- */
let msgT,idleT,rsT,drag=null;
const say=m=>{$('msg').textContent=m;clearTimeout(msgT);msgT=setTimeout(()=>$('msg').textContent='',4000)};
const wake=()=>{document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),5000)};
const settings=$('panel'),openSettings=$('show-settings'),closeSettings=$('hide-settings');
function setSettingsOpen(open){
 settings.hidden=!open;
 $('intro').hidden=!open;
 openSettings.hidden=open;
 openSettings.setAttribute('aria-expanded',String(open));
 wake();
 (open?closeSettings:openSettings).focus({preventScroll:true});
}
openSettings.onclick=()=>setSettingsOpen(true);
closeSettings.onclick=()=>setSettingsOpen(false);
['pointermove','pointerdown','keydown','focusin','touchstart','wheel'].forEach(e=>addEventListener(e,wake,{passive:true}));
const feed=()=>{say(addLog()?'薪をくべました':`薪はいっぱいです(最大${MAXL}本)`);statT=0;if(!raf)render(0)};
const flare=()=>{bGoal=Math.min(1,bGoal+(reduced?.3:.7));say('炎をあおりました')};
const pour=()=>{
 if(pourAge!==null)return;
 const root=pickFireRoot();
 if(root<0){say('火種が消えています');return}
 pourX=fireRoots[root];pourY=fireRoots[root+1];
 pourAge=0;
 say(paused?'油をかける演出は再開すると始まります':'油をかけました');
};
const togglePause=()=>{paused=!paused;$('pause').setAttribute('aria-pressed',paused);$('pause').textContent=paused?'再開':'一時停止';
 if(paused)stop();else start();syncAudio()};
const de=document.documentElement,rq=de.requestFullscreen||de.webkitRequestFullscreen,ex=document.exitFullscreen||document.webkitExitFullscreen;
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const fsUpd=()=>{if(rq)$('fs').textContent=fsEl()?'全画面を終了':'全画面'};
const toggleFs=()=>{if(!rq)return;try{const p=fsEl()?ex.call(document):rq.call(de);if(p&&p.catch)p.catch(()=>say('全画面にできませんでした'))}catch(e){say('全画面にできませんでした')}};
if(!rq){$('fs').disabled=true;$('fs').textContent='全画面は非対応'}
['fullscreenchange','webkitfullscreenchange'].forEach(e=>document.addEventListener(e,fsUpd));
$('feed').onclick=feed;$('flare').onclick=flare;$('pause').onclick=togglePause;$('fs').onclick=toggleFs;
$('oil').onclick=pour;
$('auto').checked=S.auto;$('auto').onchange=e=>{S.auto=e.target.checked;save()};
$('wind').value=Math.round(S.wind*100);$('wind').oninput=e=>{S.wind=e.target.value/100;save()};
$('snd').onclick=()=>{snd=!snd;if(snd&&!AC&&!initAudio()){snd=false;say('この環境では音声を利用できません')}
 syncAudio();
 $('snd').setAttribute('aria-pressed',snd);$('snd').textContent=snd?'音: オン':'音: オフ'};
c2.addEventListener('pointerdown',e=>{drag={x:e.clientX,w:S.wind};try{c2.setPointerCapture(e.pointerId)}catch(_){}});
c2.addEventListener('pointermove',e=>{if(!drag)return;S.wind=Math.max(-1,Math.min(1,drag.w+(e.clientX-drag.x)/W*2.5));$('wind').value=Math.round(S.wind*100)});
const endDrag=()=>{if(drag){drag=null;save()}};c2.addEventListener('pointerup',endDrag);c2.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
 const k=e.key.toLowerCase();
 if(k==='escape'&&!fsEl()){setSettingsOpen(settings.hidden);return}
 if(e.target.matches&&e.target.matches('input'))return;
 if(k==='h')setSettingsOpen(settings.hidden);else if(k==='l')feed();else if(k==='a')flare();else if(k==='p')togglePause();else if(k==='f')toggleFs();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else start();syncAudio()});
addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(resize,120)});
if(paused){$('pause').setAttribute('aria-pressed','true');$('pause').textContent='再開'}
resize();wake();start();
})();
</script>
</body>
</html>
