<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100d0c">
<title>薪一本の燃え方 — 焚き火の寄り画</title>
<meta name="description" content="薪一本の燃焼を寄り画で見る動く壁紙。炎から赤い熾火へ移り、白い灰が崩れて下に積もるまでを再生できます。">
<link rel="canonical" href="https://scott2121.github.io/wallpaper-sites/wallpapers/campfire/close-up/">
<link rel="stylesheet" href="./style.css">
<script type="module" src="./player.js"></script>
</head>
<body>
<main class="viewer">
  <canvas id="scene" role="img" aria-label="薪一本が燃え、赤い熾火を経て、灰が崩れ落ちる寄り画"></canvas>

  <div class="interface" id="settings" aria-label="再生設定">
    <header class="intro">
      <div>
        <a class="back" href="../">← 焚き火へ戻る</a>
        <h1>薪一本の燃え方</h1>
        <p class="description">炎が消えたあと、赤い熾火が残り、灰が静かに積もるまで。</p>
      </div>
      <button id="hide-settings" type="button" aria-controls="settings" aria-expanded="true">設定を閉じる</button>
    </header>

    <section class="dock" aria-label="再生コントロール">
      <div class="stage-row">
        <p class="stage" id="stage" role="status" aria-live="polite">読み込み中</p>
        <span class="time" id="time" aria-hidden="true">0:00 / 0:48</span>
      </div>
      <label class="sr-only" for="timeline">燃焼の進み具合</label>
      <input id="timeline" type="range" min="0" max="48" step="0.1" value="0" aria-valuetext="0秒" disabled>

      <div class="buttons">
        <button class="primary" id="play" type="button" disabled>再生</button>
        <button id="restart" type="button" disabled>最初から</button>
        <label class="speed" for="speed">速度
          <select id="speed" disabled>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
        </label>
        <button id="fullscreen" type="button">全画面</button>
      </div>
    </section>
  </div>

  <button class="show-settings" id="show-settings" type="button" aria-controls="settings" aria-expanded="false" hidden>設定を開く</button>
  <p class="notice" id="notice" role="status" aria-live="polite">薪の寄り画を準備しています。</p>
  <noscript><p class="notice">寄り画を見るには JavaScript を有効にしてください。</p></noscript>
</main>
</body>
</html>
